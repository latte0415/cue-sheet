// 모든 항목: { k, key, dept(cast|light|sound|stage|common), person(인/아웃의 사람 — 여러 사람 큐는 첫 사람), people(여러 사람 큐의 모두), who(공통 항목이 걸린 씬의 출연), text, 이동 대상 item | scene(+sp) | track | pv, fix }
// x = { show, entries: [{ item, scene, q }](문서 순서), sceneTitle(s), pname(id), hasPerson(id), cueText(c), trackByNo(no), hasFile(t), useCount(t), propIssues() → [{ e, prev, text }], fileWhere }
function checkCollect(x) {
  const S = x.show, out = {};
  CK_GROUPS.forEach(g => { out[g.k] = []; });
  const add = (k, o) => { o.k = k; o.key = [k, o.item || o.scene || o.track || (o.pv ? 'pv' : ''), o.text].join('|'); out[k].push(o); };
  const ref = e => (e.q ? 'Q' + e.q + ' · ' : '') + x.sceneTitle(e.scene);
  const scenes = [];
  S.parts.forEach(p => p.scenes.forEach(s => scenes.push(s)));
  const noCues = its => its.every(it => !it.cues.length);
  // 씬 경계: 씬 마지막 큐 문단의 IN 이 다음 씬 출연에 있으면 "다음 씬 등장", 첫 큐 문단의 OUT 이 앞 씬 출연에 있으면 "앞 씬 퇴장"
  const edge = (e, mv, pid) => {
    const si = scenes.indexOf(e.scene), its = e.scene.items, ii = its.indexOf(e.item);
    if (mv === 'in') { const nx = scenes[si + 1]; return !!nx && nx.cast.includes(pid) && noCues(its.slice(ii + 1)); }
    const pv = scenes[si - 1]; return !!pv && pv.cast.includes(pid) && noCues(its.slice(0, ii));
  };
  const last = new Map(), noProps = [];
  x.entries.forEach(e => {
    const id = e.item.id, sid = e.scene.id;
    e.item.cues.forEach(c => {
      const text = `${ref(e)} — ${DEPT_L[c.dept]} ${x.cueText(c)}`;
      // person = 출연 큐의 첫 사람, people = 그 큐의 모든 사람 (공연자 시점 필터 ckMine 이 본다 — v10 한 큐에 여러 사람)
      const who = c.dept === 'cast' ? castRows(c.cast).map(r => r.personId).filter(Boolean) : [];
      const own = () => Object.assign({ dept: c.dept, person: who[0] || null, sid, item: id, text }, who.length > 1 ? { people: who.slice() } : {});
      if (c.status === 'tbd') add('tbd', own());
      if (!String(c.trigger || '').trim()) add('trig', own());
      if (c.dept === 'light' && c.status !== 'tbd' && !(c.light && c.light.channels.length) && !(c.light && String(c.light.anim || '').trim())) add('light', own());
      // 소품 미지정: lib/validate.js 의 stage-no-props 와 같은 조건 (확정 무대 큐, 소품 행 없음). 소품 목록이 비면 아래 propsSkip 한 줄로 흡수
      if (c.dept === 'stage' && c.status !== 'tbd' && !(c.stage && Array.isArray(c.stage.props) && c.stage.props.some(r => r && r.propId))) noProps.push(own());
      if (c.dept === 'sound' && c.sound && c.sound.track != null && !x.trackByNo(c.sound.track)) add('track', { dept: 'sound', person: null, sid, item: id, text: `${ref(e)} — BGM ${c.sound.track} 은 트랙 목록에 없음` });
      // 인/아웃 연속성 · 출연 명단은 사람마다 따로 (한 큐에 여러 사람이면 그 줄마다)
      if (c.dept === 'cast') castRows(c.cast).forEach(r => {
        if (!r.personId || (r.move !== 'in' && r.move !== 'out')) return;
        const pid = r.personId, mv = r.move, pr = last.get(pid), M = MOVES[mv];
        const base = { dept: 'cast', person: pid, sid, item: id };
        if (pr && pr.move === mv) add('cast', Object.assign(base, { text: `${ref(e)} — ${x.pname(pid)} ${M} 다음 또 ${M} (앞: ${ref(pr.e)})` }));
        if (!e.scene.cast.includes(pid) && !edge(e, mv, pid)) add('castlist', Object.assign({}, base, { fix: x.hasPerson(pid) ? { scene: sid, person: pid } : null, text: `${ref(e)} — ${x.pname(pid)} ${M} 큐가 있지만 씬 출연에 없음` }));
        last.set(pid, { move: mv, e });
      });
    });
    // 빈 문단에 붙은 큐: 큐 지점이 아닌 문단인데 본문이 비었다 — 문단 하나에 한 줄, 고치기 [큐 지점으로]
    if (e.item.kind !== 'cue' && e.item.cues.length && !String(e.item.text || '').trim()) add('emptyq', { dept: 'common', person: null, sid, who: e.scene.cast.slice(), item: id, fix: { item: id }, text: `${ref(e)} — 빈 문단에 큐 ${e.item.cues.length}개 (${e.item.cues.map(c => DEPT_L[c.dept]).join('·')})` });
    e.item.comments.forEach(cm => { if (!cm.resolved) add('cmt', { dept: 'common', person: null, sid, who: e.scene.cast.slice(), item: id, text: `${ref(e)} — ${cm.author}: ${cut(cm.text, 50)}` }); });
  });
  scenes.forEach(sc => sc.comments.forEach(cm => {
    if (!cm.resolved) add('cmt', { dept: 'common', person: null, sid: sc.id, who: sc.cast.slice(), scene: sc.id, sp: true, text: `씬 ${x.sceneTitle(sc)} — ${cm.author}: ${cut(cm.text, 50)}` });
  }));
  let have = 0;
  S.tracks.forEach(t => {
    if (x.hasFile(t)) { have++; return; }
    const n = x.useCount(t);
    add('files', { dept: 'sound', person: null, track: t.id, text: `BGM ${t.no == null ? '?' : t.no}${t.title ? ' ' + t.title : ''}${n ? ' · 큐 ' + n + '개' : ' · 쓰는 큐 없음'}` });
  });
  // 소품: 소품 목록이 비어 있는데 무대 큐가 있으면 검사하지 않는다 (소품을 안 쓰는 공연에서 전부 "목록에 없음" 이 되지 않게)
  const hasStage = x.entries.some(e => e.item.cues.some(c => c.dept === 'stage'));
  const propsSkip = !(S.props || []).length && hasStage;
  if (!propsSkip) noProps.forEach(o => add('noprops', o));
  if (!propsSkip) x.propIssues().forEach(p => add('props', p.e
    ? { dept: 'stage', person: null, sid: p.e.scene.id, item: p.e.item.id, text: `${ref(p.e)} — ${p.text}${p.prev ? ` (앞: ${ref(p.prev)})` : ''}` }
    : { dept: 'stage', person: null, pv: true, text: `공연 전 무대 — ${p.text}` }));
  S.parts.forEach(p => p.scenes.forEach(sc => {
    if (sc.type === 'act' && !sc.items.length) add('empty', { dept: 'common', person: null, sid: sc.id, who: sc.cast.slice(), scene: sc.id, text: `${x.sceneTitle(sc)} — ${p.name}` });
  }));
  const groups = CK_GROUPS.map(g => Object.assign({}, g, { list: out[g.k] }));
  groups.find(g => g.k === 'files').note = (x.fileWhere || '') + ' 파일이 없는 BGM.';
  return { groups, files: { have, total: S.tracks.length }, propsSkip };
}
// role: 'all' | 'light' | 'sound' | 'stage' | 'p:<사람 id>'. 공연자는 자기 IN/OUT 과 자기가 나오는 씬의 공통 항목(코멘트·빈 액트)만
function ckMine(it, role) {
  if (role === 'all') return true;
  if (role.indexOf('p:') === 0) { const p = role.slice(2); return it.person === p || (!!it.people && it.people.includes(p)) || (it.dept === 'common' && (!it.who || it.who.includes(p))); }
  return it.dept === role || it.dept === 'common';
}
function ckRelevant(g, role) {
  if (role === 'all' || g.depts === 'any' || g.depts.includes('common')) return true;
  return g.depts.includes(role.indexOf('p:') === 0 ? 'cast' : role);
}
// 건수 = 막힘 + 확인. 참고는 세지 않고, 음원 파일은 몇 곡이든 한 건(올리는 일 하나)
function ckCount(groups, sev) {
  return groups.reduce((a, g) => a + ((sev ? g.sev === sev : g.sev !== 'info') ? (g.k === 'files' ? Math.min(1, g.list.length) : g.list.length) : 0), 0);
}
// r = checkCollect 결과. showAll 이면 역할과 상관없이 전부 (역할 선택은 그대로)
function checkFilter(r, role, showAll) {
  const all = role === 'all' || !!showAll;
  const groups = r.groups.map(g => Object.assign({}, g, { rel: all || ckRelevant(g, role), list: all ? g.list : g.list.filter(it => ckMine(it, role)) }));
  return {
    groups, filtered: !all, total: ckCount(groups), block: ckCount(groups, 'block'), info: ckCount(groups, 'info'),
    fullTotal: ckCount(r.groups), fullInfo: ckCount(r.groups, 'info'),
    files: r.files, propsSkip: r.propsSkip && (all || role === 'stage')
  };
}
// "다음" 순서: 화면에 보이는 순서 그대로 — 접힌 그룹(open[k] 아님)은 건너뛰고, 음원 파일 묶음은 한 줄(누르면 첫 트랙)
function checkNav(v, open) {
  const out = [];
  v.groups.forEach(g => {
    if (!g.list.length || (g.fold && !(open && open[g.k]))) return;
    if (g.k === 'files') out.push(Object.assign({}, g.list[0], { key: 'files|*', bundle: true }));
    else g.list.forEach(it => out.push(it));
  });
  return out;
}
function ckNavIndex(nav, key) { return key ? nav.findIndex(x => x.key === key || (x.bundle && key.indexOf('files|') === 0)) : -1; }

/* ================= 뷰: 점검 ================= */
// 공연 전에 한 번에 봐야 하는 문제들 — 규칙은 checkCollect, 여기서는 지금 화면의 데이터·역할로 묶는다. total = 막힘 + 확인 (내비·런 버튼 숫자)
function checkIssues() {
  const r = checkCollect({
    show: state.show, entries: IDX.entries, sceneTitle, pname, hasPerson: id => IDX.people.has(id), cueText: c => cueText(c), trackByNo,
    hasFile: t => !!trackUrl(t), useCount: t => trackUses(t).length, propIssues: () => stageStates().issues,
    fileWhere: Store.mode === 'server' ? '서버에' : '이 브라우저에'
  });

}
function ckBtn(x, label) {

}
function viewCheck() {

  const head = v.filtered ? `${esc(who)} ` : state.role !== 'all' ? '전체 ' : '남은 문제 ';
  h += `<p class="ck-sum ${v.total ? '' : 'ok'} ${v.block ? 'has-block' : ''}" id="ck-sum"><span>${v.total ? `${head}<b>${v.total}</b>건` : `${v.filtered ? esc(who) + ' ' : ''}<b>문제 없음</b>`}</span>`;
  if (v.block) h += `<span class="sep">·</span>막힘 <span class="mono">${v.block}</span>`;
  if (v.info) h += `<span class="sep">·</span><span class="muted">참고 ${v.info}</span>`;
  if (state.role !== 'all') h += `<span class="sep">·</span><button type="button" class="tb" id="ck-all" data-act="ck-all" aria-pressed="${!!state.ckAll}">${state.ckAll ? `${esc(roleLabel())}만 보기` : `전체 ${v.fullTotal}건 보기`}</button>`;
  h += '</p>';
  let sev = '';
  const none = [];
  v.groups.forEach(g => {
    if (!g.list.length) { if (g.rel && !((g.k === 'props' || g.k === 'noprops') && v.propsSkip)) none.push(g.short); return; }
    if (g.sev !== sev) { sev = g.sev; h += `<h3 class="ck-sev ${sev}">${CK_SEV_L[sev]}</h3>`; }
    const n = g.list.length, open = g.fold ? !!state.ckOpen[g.k] : true;
    const title = g.fold ? `<button type="button" class="ck-fold" data-act="ck-fold" data-k="${g.k}" aria-expanded="${open}">${esc(g.t)}</button>` : esc(g.t);
    h += `<section class="ck-g ${g.sev}" id="ck-${g.k}"><h4><span class="ck-t">${title}</span>${g.k === 'files' ? '' : `<span class="n">${n}</span>`}${g.note ? `<span class="ck-note">${esc(g.note)}</span>` : ''}</h4>`;
    if (!open) { h += '</section>'; return; }
    h += '<ol>';
    if (g.k === 'files') {
      const fo = !!state.ckOpen.files, first = g.list[0];
      h += `<li class="fix ${last === 'files|*' || (last && last.indexOf('files|') === 0 && !fo) ? 'last' : ''}">${ckBtn(Object.assign({}, first, { key: 'files|*' }), `음원 파일 ${v.files.have}/${v.files.total} 올림${smOn() ? ` · 이 기기에 받음 ${smState().ready}/${v.files.total}` : ''}`)}<button type="button" class="tb ck-fix" data-act="ck-fold" data-k="files" aria-expanded="${fo}">${fo ? '접기' : `없는 ${g.list.length}곡 보기`}</button></li>`;

// 점검에서 이동: 마지막으로 누른 항목·순번을 기억하고, 패널(또는 본문 위) 머리에 "← 점검 (n/N) · 다음 →"
// step: "다음" 으로 온 이동 — 브라우저 기록을 하나 더 쌓지 않는다 (뒤로가기 한 번에 점검으로)
let hashReplace = false;
function ckGo(x, pos, step) {
  const prev = state.ckNav, usePanel = !!(x.item || x.sp), narrow = innerWidth <= 1100;
  const panelWas = prev ? prev.panelWas : state.panel;
  state.ckLast = x.key;
  state.ckNav = { key: x.key, pos, panelWas, panel: usePanel };
  // 패널을 쓰지 않는 대상: 좁은 화면에서는 패널이 본문을 덮으므로 닫는다. 넓은 화면은 점검에서 왔을 때 상태로
  if (!usePanel && (narrow || (prev && prev.panel))) state.panel = narrow ? false : panelWas;
  hashReplace = !!step;
  try {
    if (x.track) {
      setView('tracks'); render();
      const r = document.getElementById('track-' + x.track); if (r) { r.scrollIntoView({ block: 'center' }); flashEl(r); }
    } else if (x.item && IDX.byItem.has(x.item)) { cmtJump({ item: x.item }); openItem(x.item); }
    else if (x.scene) { cmtJump({ scene: x.scene }); if (x.sp) act('scene-cmts', { dataset: { scene: x.scene } }); }
    else if (x.pv) { setView('props'); render(); const s = document.getElementById('pre-props'); if (s) s.scrollIntoView({ block: 'start' }); }
  } finally { hashReplace = false; }
  // 점검 → 다른 뷰로 쌓인 기록에 표시: "← 점검" 은 이 표시가 있으면 브라우저 뒤로가기와 같게
  if (!step) { try { history.replaceState({ ck: 1 }, ''); } catch (e) { /* 무시 */ } }
  renderPanel();
}
function ckStep() {
  const nav = checkNav(checkIssues(), state.ckOpen), cur = state.ckNav; if (!cur) return;
  const i = ckNavIndex(nav, cur.key), next = i >= 0 ? i + 1 : cur.pos;
  if (next >= nav.length) { toast('점검 항목의 마지막입니다'); return; }
  ckGo(nav[next], next, true);
}
function ckBack() {
  if (history.state && history.state.ck && state.view !== 'check') { history.back(); return; }
  setView('check'); render();
}
function ckBarHtml() {

  const nav = checkNav(checkIssues(), state.ckOpen), i = ckNavIndex(nav, cur.key), at = i >= 0 ? i + 1 : Math.min(cur.pos + 1, nav.length);
  const end = (i >= 0 ? i + 1 : cur.pos) >= nav.length;
  return `<button type="button" class="tb" data-act="ck-back">← 점검</button><span class="ck-pos mono">(${at}/${nav.length})</span><span class="sep">·</span><button type="button" class="tb" data-act="ck-next" ${end ? 'disabled' : ''}>다음 →</button>`;
}
// 본문 위 줄 — 점검에서 온 이동이 패널을 열었으면 패널 머리에 대신 그린다 (renderPanel 이 부른다)

// how: 'key'(편집기 안 Ctrl+Z — 로컬 모드에서 통째 되돌리기뿐이면 조용히 false, 편집기는 글 되돌리기로 넘어간다) · 'menu'(메뉴 — 병합 모듈
//  없는 로컬 모드면 통째 되돌리기 허용, 그때는 메뉴 버튼이 먼저 한 번 더 묻는다: renderTop) · 없음(알림 [되돌리기] · 편집기 밖 Ctrl+Z)
function undoDelete(e, how) {
  if (!state.show || !state.edit) return false;
  e = e || DEL[DEL.length - 1];
  if (!e || !e.after) { if (how !== 'key') toast('되돌릴 삭제가 없습니다'); return false; }
  if (e.doc !== state.show.id) { delDrop(DEL.splice(DEL.indexOf(e), 1)); toast('다른 프로젝트의 삭제라 되돌리지 않았습니다'); return false; }
  flushSave();
  const old = state.show, M = window.CueMerge || null;
  let r;
  try { r = delRestore(e, JSON.parse(JSON.stringify(old)), M, relabel); } catch (err) { console.error('undo-del', err); r = { ok: false }; }
  // 병합 모듈이 없고(로컬 모드·서버에서 못 읽음) 삭제 뒤에 바뀐 것이 있으면 통째 되돌리기뿐 — 그 뒤의 변경이 사라진다.
  // 서버 모드는 다른 기기 변경까지 지우므로 하지 않고, 로컬 모드도 Ctrl+Z·알림으로는 하지 않는다(메뉴로만)
  if (r.ok && r.stale && (Store.mode === 'server' || how !== 'menu')) {
    if (how !== 'key' || Store.mode === 'server') toast(Store.mode === 'server' ? '되돌리지 못했습니다 — 병합 모듈이 없어 삭제 뒤에 바뀐 내용과 합칠 수 없습니다'
      : '삭제 뒤에 바뀐 내용이 있어 되돌리지 않았습니다 — 메뉴 "마지막 삭제 되돌리기"는 그 변경까지 함께 되돌립니다');
    return false;
  }
  if (!r.ok) { toast('되돌리지 못했습니다 — 삭제 뒤에 바뀐 내용과 합치지 못했습니다'); return false; }
  DEL.splice(DEL.indexOf(e), 1);
  state.show = r.show;
  // 이동 기록은 id 로 찾아 옮기므로 그대로 둔다(삭제보다 최근 이동은 이미 먼저 되돌렸다). 다시 실행할 이동은 버린다
  if (MV.show === old) MV.show = state.show;
  MV.redo = [];
  // 편집기 스냅숏: 통째 되돌렸으면 모두, 아니면 이 삭제가 건드린 씬에서 삭제 뒤에 찍힌 것만 버린다(되살린 문단이 빠진 모양이라)
  if (r.stale) UNDO.clear();
  else e.scenes.forEach(sid => { const u = UNDO.get(sid); if (u) { u.stack = u.stack.filter(y => (y.seq || 0) < e.seq); u.redo = []; u.t = 0; } });
  state.selItem = null; state.sceneEdit = null; state.moveCue = null; state.trackRenum = null;
  mountedView = null;
  commit();
  toast(`되돌렸습니다 — ${e.label}` + (r.stale ? ' (삭제 뒤의 변경도 함께 되돌림)' : r.conflicts ? ` · 그 뒤에 고친 ${r.conflicts}곳은 삭제 전 내용으로` : ''));
  return true;
}
// 편집기 안 Ctrl+Z: 이 씬을 건드린 삭제가 이 씬의 마지막 글 고치기·이동보다 최근이면 그 삭제를 되돌리고 true
function delUndoTurn(doc) {
  if (!state.edit) return false;
  const sid = doc.dataset.scene;
  let e = null; for (let k = DEL.length - 1; k >= 0; k--) if (DEL[k].scenes.includes(sid) && DEL[k].after) { e = DEL[k]; break; }
  if (!e) return false;
  const u = undoBox(doc), top = u.stack[u.stack.length - 1];
  if (top && (top.seq || 0) > e.seq) return false;
  const m = mvBox(); for (let k = m.undo.length - 1; k >= 0; k--) if (m.undo[k].scenes.includes(sid)) { if (m.undo[k].seq > e.seq) return false; break; }
  syncDoc(doc);
  return undoDelete(e, 'key'); // 못 되돌리면(로컬 모드에서 삭제 뒤에 다른 곳을 고침) 이 씬의 글 되돌리기로
}
function deleteItem(id) {
  const e = IDX.byItem.get(id); if (!e) return;
  delSnap('문단 ' + (e.q ? 'Q' + e.q : cut(e.item.text || '(빈 문단)', 12)), [e.scene.id]);
  e.scene.items.splice(e.ii, 1);
  if (state.selItem === id) state.selItem = null;
  commit(); delToast('문단을 삭제했습니다');
}
function deleteCue(itemId, cueId) {
  const e = IDX.byItem.get(itemId); if (!e) return false;
  const c = e.item.cues.find(x => x.id === cueId); if (!c) return false;
  delSnap(`큐 ${e.q ? 'Q' + e.q + ' ' : ''}${DEPT_L[c.dept]}`, [e.scene.id]);
  e.item.cues = e.item.cues.filter(x => x !== c); e.item.isCue = e.item.cues.length > 0;
  if (state.moveCue && state.moveCue.cueId === cueId) state.moveCue = null;
  // 큐 지점의 마지막 큐면 지점도 사라진다 (되돌리기는 delSnap 스냅숏)
  if (pruneCuePoint(state.show, itemId)) { if (state.selItem === itemId) state.selItem = null; buildIndex(); }
  return true;
}

/* ===== 큐를 다른 문단으로: 패널 "다른 문단으로 이동" → 다음에 누르는 문단(대본 문단·거터, 큐시트 행) ===== */
// 패널 "큐 전부 이동"(큐 2개 이상) → state.moveCue = { itemId, all: true }: 그 문단의 Q 묶음을 통째로 (끌어 옮기기의 Q 묶음과 같다)
function moveCueInfo() {
  const m = state.moveCue, e = m && IDX.byItem.get(m.itemId);
  if (m && m.all) { if (!e || !e.item.cues.length) { state.moveCue = null; return ''; } return groupTag(e.item, ' '); }
  const c = e && e.item.cues.find(x => x.id === m.cueId);
  if (!c) { state.moveCue = null; return ''; }
  return `${e.q ? 'Q' + e.q + ' · ' : ''}${DEPT_L[c.dept]} ${cut(cueText(c), 30)}`;
}
// 옮기기는 끌어 옮기기와 같은 함수 — 번호를 다시 매기고 이동 기록(MV)에 남아 Ctrl+Z 로 되돌린다 (대본·큐시트)
function moveCueTo(id) {
  const m = state.moveCue; if (!m) return;
  const src = IDX.byItem.get(m.itemId), dst = IDX.byItem.get(id);
  const ok = !!src && (m.all ? src.item.cues.length > 0 : src.item.cues.some(c => c.id === m.cueId));
  if (!ok || !dst) { state.moveCue = null; renderTop(); return; }
  if (src.item === dst.item) { toast('같은 문단입니다 — 다른 문단을 누르세요 (Esc 취소)'); return; }
  state.moveCue = null;
  if (!(m.all ? dndMoveGroup(m.itemId, id) : dndMoveCue(m.cueId, id))) { renderTop(); renderPanel(); return; }
  openItem(id);
}

/* ===== 트랙 번호 변경: 쓰는 큐가 있으면 함께 바꿀지 확인, 중복은 거부 ===== */
function renumTrack(tr, to) {
  const from = tr.no;
  let n = 0;
  IDX.entries.forEach(e => e.item.cues.forEach(c => { if (c.dept === 'sound' && c.sound && c.sound.track === from) { c.sound.track = to; n++; } }));
  tr.no = to;
  if (AU.trackNo === from) AU.trackNo = to;
  state.show.tracks.sort((x, y) => (x.no || 0) - (y.no || 0));
  state.trackRenum = null;
  commit(); toast(`BGM ${from} → ${to}${n ? ` · 큐 ${n}개도 함께 바꿈` : ''}`);
}

/* ================= 토스트 / 2단계 확인 ================= */
let toastT = null;
// 되돌리기 알림의 단축키 표시 (키보드 없는 기기는 [되돌리기] 를 누른다)
const UNDO_KEY = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '') ? '⌘Z' : 'Ctrl+Z';
function toast(msg, o) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  if (o && o.undo) {
    t.appendChild(document.createTextNode(' · ' + UNDO_KEY));
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toast-a'; b.id = 'toast-undo'; b.dataset.act = 'undo-del'; b.textContent = '되돌리기';
    t.appendChild(b);
  }
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, (o && o.ms) || 3000);
}
function armConfirm(el) {
  if (el.dataset.armed === '1') {
    // 확인 후에는 원래대로 — 메뉴처럼 다시 그리지 않는 버튼이 "확인된 상태"로 남지 않게
    clearTimeout(el._t); el.dataset.armed = ''; el.innerHTML = el.dataset.orig; el.classList.remove('armed');
    return true;
  }
  el.dataset.armed = '1'; el.dataset.orig = el.innerHTML;
  el.textContent = el.dataset.confirm || '정말?';
  el.classList.add('armed');
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (el.isConnected) { el.dataset.armed = ''; el.innerHTML = el.dataset.orig; el.classList.remove('armed'); } }, 3500);
  return false;
}

function createImported(show) {
  api('POST', '/shows', { show }).then(r => {
    if (r.status !== 201) { if (state.modal) { state.modal.err = '가져오기 실패 (HTTP ' + r.status + ')'; renderModal(); } return; }
    setEditKey(r.data.id, DEFAULT_EDIT_KEY);
    closeModal(true);
    return flushServer().then(() => openShow(r.data.id)).then(ok => { if (ok) toast(`새 프로젝트로 가져왔습니다 — ${state.show.title}`); });
  }).catch(e => { if (state.modal) { state.modal.err = '가져오기 실패: ' + e.message; renderModal(); } });
}

/* ================= 액션 ================= */
function act(a, el) {
  const S = state.show;
  switch (a) {
    case 'view': if (el.dataset.view !== 'check') state.ckNav = null; setView(el.dataset.view); render(); break;
    case 'role-pick': { const r = 'p:' + el.dataset.person; state.role = state.role === r ? 'all' : r; savePrefs(); render(); break; }
    case 'mode':
      // 서버 모드에서 편집 비밀번호를 모르면 먼저 묻는다
      if (el.dataset.mode === 'edit' && !canEdit()) { openUnlock({ then: 'edit' }); break; }
      state.edit = el.dataset.mode === 'edit'; state.sceneEdit = null; savePrefs(); render(); break;
    case 'panel-toggle': state.panel = !state.panel; if (state.panel && !state.selItem && state.panelTab !== 'scene') { if (state.panelTab !== 'all') markSeen(); state.panelTab = 'all'; } savePrefs(); renderTop(); renderPanel(); break;
    case 'panel-close': state.panel = false; savePrefs(); renderTop(); renderPanel(); break;
    case 'panel-tab': if (el.dataset.tab === 'all' && state.panelTab !== 'all') markSeen(); state.panelTab = el.dataset.tab; renderPanel(); break;
    case 'scene-cmts': {
      if (!IDX.byScene.has(el.dataset.scene)) break;
      state.panel = true; state.panelTab = 'scene'; state.panelScene = el.dataset.scene; state.panelFocus = 'comments';
      savePrefs(); renderTop(); renderPanel(); break;
    }
    case 'comment-goto-scene': if (innerWidth <= 1100) state.panel = false; savePrefs(); cmtJump({ scene: el.dataset.scene }); break;
    case 'undo-del': { const menu = el.id === 'menu-undo-del'; state.menuOpen = false; if (menu) renderTop(); undoDelete(null, menu ? 'menu' : undefined); break; }
    case 'cue-move': {
      state.moveCue = { itemId: el.dataset.item, cueId: el.dataset.cue };
      if (innerWidth <= 1100) { state.panel = false; savePrefs(); }
      renderTop(); renderPanel(); break;
    }
    case 'cue-move-all': {
      const e = IDX.byItem.get(el.dataset.item); if (!e || !e.item.cues.length) break;
      state.moveCue = { itemId: el.dataset.item, all: true };
      if (innerWidth <= 1100) { state.panel = false; savePrefs(); }
      renderTop(); renderPanel(); break;
    }
    case 'move-cancel': state.moveCue = null; renderTop(); renderPanel(); break;
    case 'cast-add': {
      const se = IDX.byScene.get(el.dataset.scene), pid = el.dataset.person;
      if (!se || !IDX.people.has(pid)) break;
      if (!se.scene.cast.includes(pid)) se.scene.cast.push(pid);
      commit(); toast(`${sceneTitle(se.scene)} 출연에 ${pname(pid)} 추가`); break;
    }
    case 'track-renum': {
      const rn = state.trackRenum, tr = rn && S.tracks.find(x => x.id === rn.id); if (!tr) break;
      if (S.tracks.some(x => x !== tr && x.no === rn.to)) { state.trackRenum = null; render(); toast(`BGM ${rn.to} 번호가 이미 있습니다`); break; }
      renumTrack(tr, rn.to); break;
    }
    case 'track-renum-cancel': state.trackRenum = null; render(); break;
    case 'menu-toggle': state.menuOpen = !state.menuOpen; renderTop(); break;
    // ---- 6차: 서버 동기화 · 프로젝트 · 시작 화면
    case 'sync-load': {
      const c = Srv.conflict; if (!c) break;
      applyRemote(c, true); toast(`서버 버전(rev ${c.rev})을 불러왔습니다`); break;
    }
    case 'sync-overwrite': {
      const c = Srv.conflict; if (!c || Srv.outdated || newerShow(c)) break; // 새 형식 데이터는 옛 화면이 덮어쓰지 않는다
      // 기준도 그 서버 내용으로 — 덮어쓰는 사이 또 409 가 나면 "서버 것 대비 내 것" 을 내 변경으로 보고 합친다
      try { Srv.base = idsOk(c.show) ? migrate(c.show) : null; } catch (e) { Srv.base = null; }
      Srv.rev = c.rev; Srv.conflict = null; Srv.dirty = true; Srv.mergeTries = 0; renderSyncBar(); push(); toast('내 버전으로 덮어씁니다'); break;
    }
    case 'sync-merge': {
      const c = Srv.conflict; if (!c) break;
      const r = mergeWith(c); // 바를 띄운 뒤에도 고쳤을 수 있으니 지금 내용으로 다시 합친다
      if (!r) { toast('합치지 못했습니다 — 다른 선택지를 고르세요'); break; }
      applyRemote(c, true, r.sameAsRemote ? null : r.show); Srv.mergeTries = 0; push();
      toast(r.conflicts.length ? `충돌 ${r.conflicts.length}곳은 서버 것으로, 나머지는 합쳤습니다` : '다른 기기의 변경과 합쳤습니다'); break;
    }
    case 'proj-toggle':
      state.projOpen = !state.projOpen; state.menuOpen = false; renderTop(); renderProj();
      if (state.projOpen) refreshList().then(renderProj, () => {});
      break;
    case 'proj-open': switchShow(el.dataset.id).catch(e => toast('전환 실패: ' + e.message)); break;
    case 'proj-new': { const ti = $('#pj-new-title'); createShow(el.dataset.kind, ti ? ti.value.trim() : '').catch(e => toast('만들기 실패: ' + e.message)); break; }
    case 'proj-dup': {
      const id = el.dataset.id;
      (id === Srv.showId ? flushServer() : Promise.resolve(true)).then(ok => {
        if (!ok) { toast('저장되지 않은 변경이 있어 복제하지 않았습니다'); return null; }
        return api('POST', showPath(id) + '/duplicate');
      }).then(r => {
        if (!r) return;
        if (r.status !== 201) { toast('복제 실패 (HTTP ' + r.status + ')'); return; }
        setEditKey(r.data.id, DEFAULT_EDIT_KEY); // 복제본은 기본 비밀번호로 시작한다
        return refreshList().then(() => { renderProj(); const x = Srv.list.find(y => y.id === r.data.id); toast('복제했습니다 — ' + (x ? x.title : '')); });
      }).catch(e => toast('복제 실패: ' + e.message));
      break;
    }
    case 'proj-del': {
      const id = el.dataset.id, cur = id === Srv.showId;
      if (!editKey(id)) { toast(cur ? '삭제하려면 먼저 편집 잠금을 해제하세요' : '그 프로젝트를 열어 편집 잠금을 해제한 뒤 삭제하세요'); if (cur) { state.projOpen = false; renderProj(); openUnlock(); } break; }
      const wasDirty = cur && (Srv.dirty || !!saveT);
      if (cur) { clearTimeout(saveT); saveT = null; Srv.dirty = false; clearTimeout(Srv.retryT); }
      api('DELETE', showPath(id)).then(r => {
        if (r.status === 403 || r.status === 429) {
          toast(r.status === 429 ? '편집 비밀번호를 너무 많이 틀렸습니다 — 잠시 뒤 다시' : '편집 비밀번호가 맞지 않아 삭제하지 않았습니다');
          if (wasDirty) { Srv.dirty = true; push(); } else if (cur) openUnlock();
          return;
        }
        if (r.status !== 200 && r.status !== 404) { toast('삭제 실패 (HTTP ' + r.status + ')'); return; }
        return refreshList().then(list => {
          if (r.data && r.data.trashDays) TRASH.days = r.data.trashDays;
          toast(`휴지통으로 옮겼습니다 — ${TRASH.days}일 안에 휴지통에서 되살릴 수 있습니다`, { ms: 5000 });
          if (!cur) { renderProj(); return; }
          Srv.showId = null; state.projOpen = false; renderProj(); stopAllAudio(); clearInterval(Srv.pollT);
          if (list.length) return openShow(list[0].id);
          delClear(); state.show = null; savePrefs(); showGate('first');
        });
      }).catch(e => toast('삭제 실패: ' + e.message));
      break;
    }
    // 휴지통
    case 'trash-open': openTrash(); break;
    case 'trash-restore': restoreTrash(el.dataset.tid); break;
    case 'trash-back': showGate(Srv.list.length ? 'pick' : 'first'); break;
    // 편집 비밀번호 · 버전 기록
    case 'unlock-open': openUnlock({ why: Srv.locked ? 'save' : '' }); break;
    case 'unlock-do': unlockDo(); break;
    case 'editpw-open': state.menuOpen = false; renderTop(); state.modal = { type: 'editpw', err: '' }; renderModal(true); break;
    case 'editpw-do': editPwDo(); break;
    case 'history-open': state.menuOpen = false; renderTop(); if (canEdit()) openHistory(); else openUnlock({ then: 'history' }); break;
    case 'history-restore': restoreRev(Number(el.dataset.rev)); break;
    case 'edit-lock':
      state.menuOpen = false; renderTop();
      flushServer().then(ok => {
        if (!ok) { toast('저장되지 않은 변경이 있어 잠그지 않았습니다 — 상단 안내를 먼저 확인하세요'); return; }
        setEditKey(Srv.showId, ''); state.edit = false; state.sceneEdit = null; savePrefs(); render();
        toast('이 기기에서 편집을 잠갔습니다 — 다시 편집하려면 비밀번호가 필요합니다');
      });
      break;
    case 'lock-discard':
      api('GET', showPath()).then(r => {
        if (r.status !== 200 || !r.data) { toast('불러오기 실패 (HTTP ' + r.status + ')'); return; }
        applyRemote(r.data, true); toast('서버 버전을 불러왔습니다 — 이 기기의 변경은 버렸습니다 (브라우저 백업은 남음)', { ms: 5000 });
      }).catch(e => toast('불러오기 실패: ' + e.message));
      break;
    case 'gate-pw': gatePassword(); break;
    case 'gate-new': { const ti = $('#gate-title'); createShow(el.dataset.kind, ti ? ti.value.trim() : '').catch(bootFail); break; }
    case 'gate-open': openShow(el.dataset.id).catch(bootFail); break;
    case 'gate-retry': location.reload(); break;
    case 'nav-toggle': state.navOpen = !state.navOpen; renderNav(); break;
    case 'nav-close': state.navOpen = false; renderNav(); break;
    case 'export': state.menuOpen = false; renderTop(); state.modal = { type: 'export' }; renderModal(); { const b = $('#btn-copy'); if (b) b.focus(); } break;
    case 'import': state.menuOpen = false; renderTop(); state.modal = { type: 'import', text: '', err: '' }; renderModal(true); break;
    case 'reset':
      state.show = sampleShow(); state.selItem = null; state.runItemId = null; state.menuOpen = false; state.sceneEdit = null;
      state.moveCue = null; state.trackRenum = null; state.panelScene = null; delClear(); SETUP_DONE.clear();
      UNDO.clear(); if (rolePerson()) state.role = 'all';

  toast(`새 큐 지점${ne && ne.q ? ' Q' + ne.q : ''} 에 큐 ${r.ids.length}개를 옮겼습니다 — Ctrl+Z 되돌리기`);
  return r;
}
// 거터 Q 번호에 포커스 + Alt+↑/↓: 이전·다음 문단으로 (씬 경계를 넘는다). 큐가 있는 문단에 닿으면 합치되, 이어서 누르면
// 방금 옮긴 큐만 계속 간다 — 그 문단의 원래 큐는 제자리에 남는다
const QKEY = { itemId: null, ids: null, all: '' }; // all: 옮긴 직후 그 문단의 큐 id 전부 — 그 사이 큐가 바뀌었으면 이어 가지 않는다
document.addEventListener('keydown', ev => {
  const b = ev.target && ev.target.closest && ev.target.closest('#script .g.has-q .g-open[data-item]');
  if (!b || !ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
  ev.preventDefault(); ev.stopPropagation();
  if (!dndOn()) return;
  const id = b.dataset.item, e = IDX.byItem.get(id); if (!e) return;
  const nb = IDX.entries[e.ord + (ev.key === 'ArrowUp' ? -1 : 1)];
  if (!nb) { toast(ev.key === 'ArrowUp' ? '맨 첫 문단입니다' : '맨 마지막 문단입니다'); return; }
  const carry = QKEY.itemId === id && QKEY.all === e.item.cues.map(c => c.id).join(',') && QKEY.ids.length < e.item.cues.length ? QKEY.ids : null;
  const r = dndMoveGroup(id, nb.id, carry);
  if (!r) return;
  const ni = ITEMS.get(nb.id);
  Object.assign(QKEY, { itemId: nb.id, ids: r.ids, all: ni ? ni.cues.map(c => c.id).join(',') : '' });
  const nbtn = $(`#script .g[data-for="${cssq(nb.id)}"] .g-open`);
  if (nbtn) { nbtn.focus({ preventScroll: true }); nbtn.scrollIntoView({ block: 'nearest' }); }
}, true);
// e 를 되돌리거나(redo=false) 다시 실행(redo=true)
function dndApply(e, redo) {
  const S = state.show, dst = redo ? e.to : e.from;
  let sids, docs = e.kind === 'item';
  if (e.kind === 'item') {
    const cur = dndFindItem(S, e.id); if (!cur || !dndScene(S, dst.sceneId)) return false;
    sids = [cur.scene.id, dst.sceneId];
    dndSync(sids);
    if (!relocateItem(S, e.id, dst.sceneId, dst.index)) return false;
  } else if (e.kind === 'newpt') {
    // 새 큐 지점으로 옮긴 것: 되돌리면 원래 지점을 되살리고 큐를 돌려보낸다(빈 새 지점은 relocateCueGroup 이 정리). 다시 하면 같은 id 로 다시 만든다
    if (redo) {
      const cur = dndFindCue(S, e.ids[0]); if (!cur || !dndScene(S, e.to.sceneId)) return false;
      sids = [cur.scene.id, e.to.sceneId];
      const r = relocateCuesToNewPoint(S, e.ids, e.to.sceneId, e.to.index, e.pointId);
      if (!r || !r.changed) return false;
      e.pruned = r.pruned;
    } else {
      if (e.pruned && !dndFindItem(S, e.pruned.item.id)) restoreCuePoint(S, e.pruned);
      const pt = dndFindItem(S, e.pointId), di = dndFindItem(S, e.from.itemId); if (!pt || !di) return false;
      sids = [pt.scene.id, di.scene.id];
      const r = relocateCueGroup(S, e.pointId, e.from.itemId, e.from.index, e.ids);
      if (!r || !r.changed) return false;
    }
    docs = true;
  } else {
    // 되돌리기: 옮기면서 사라진 큐 지점을 먼저 제자리에 되살린다 (다시 실행하면 relocate 가 다시 정리하고 새 자리를 적는다)
    if (!redo && e.pruned && !dndFindItem(S, e.pruned.item.id)) restoreCuePoint(S, e.pruned);
    let r;
    if (e.kind === 'group') {
      // 묶음의 큐가 지금 있는 문단에서 그 큐들만 (합친 문단의 원래 큐는 남는다)
      const cur = e.ids.map(id => dndFindCue(S, id)).find(Boolean), di = dndFindItem(S, dst.itemId); if (!cur || !di) return false;
      sids = [cur.scene.id, di.scene.id];
      r = relocateCueGroup(S, cur.item.id, dst.itemId, dst.index, e.ids);
      if (!r || !r.changed) return false;
    } else {
      const cur = dndFindCue(S, e.id), di = dndFindItem(S, dst.itemId); if (!cur || !di) return false;
      sids = [cur.scene.id, di.scene.id];
      r = relocateCue(S, e.id, dst.itemId, dst.index);
      if (!r) return false;
    }
    if (redo) e.pruned = r.pruned;
    if (e.pruned) docs = true;
  }
  if (redo) renumberLabels(S); else restoreLabels(S, e.labels);
  e.scenes = Array.from(new Set(e.scenes.concat(sids)));
  dndRedraw(sids, docs, e.kind === 'item' ? e.id : null);
  return true;
}
// 되돌리기 한 단계. sid 가 있으면(편집기 안) 그 씬을 건드린 이동만 본다
function dndUndoStep(sid) {
  const m = mvBox();
  let j = -1; for (let k = m.undo.length - 1; k >= 0; k--) if (!sid || m.undo[k].scenes.includes(sid)) { j = k; break; }
  if (j < 0) return false;
  const e = m.undo[j];
  // 같은 문단·큐를 더 나중에 옮긴 기록이 있으면 맨 위부터 그것까지 차례로 (자리가 꼬이지 않게)
  // Q 묶음(ids)과 그 안의 큐 하나(id)도 "같은 것"이다
  const mine = new Set(e.ids || [e.id]);
  const list = m.undo.slice(j + 1).some(x => (x.ids || [x.id]).some(id => mine.has(id))) ? m.undo.splice(j).reverse() : m.undo.splice(j, 1);
  let n = 0;
  list.forEach(x => {
    const ok = dndApply(x, false);
    // 이 이동 뒤에 그 씬들에서 찍힌 편집기 스냅숏은 이동이 반영된 모양이라 이제 맞지 않는다 — 버린다
    x.scenes.forEach(s => { const u = UNDO.get(s); if (u) { u.stack = u.stack.filter(y => (y.seq || 0) < x.seq); u.redo = []; u.t = 0; } });
    if (ok) { n++; x.rseq = ++UNDO_SEQ; m.redo.push(x); }
  });
  toast(n ? (n > 1 ? `옮기기 ${n}개를 되돌렸습니다` : '옮기기를 되돌렸습니다') : '옮긴 문단·큐를 찾지 못해 되돌리지 못했습니다');
  return true;
}
function dndRedoStep(sid) {
  const m = mvBox();
  let j = -1; for (let k = m.redo.length - 1; k >= 0; k--) if (!sid || m.redo[k].scenes.includes(sid)) { j = k; break; }
  if (j < 0) return false;
  const e = m.redo[j];
  // 되돌린 뒤 그 씬에서 글을 고쳤으면 다시 실행하지 않는다 (보통의 "다시 실행" 규칙과 같다)
  if (e.scenes.some(s => { const u = UNDO.get(s); return u && u.stack.some(y => (y.seq || 0) > e.rseq); })) { m.redo = []; return false; }
  m.redo.splice(j, 1);
  if (!dndApply(e, true)) { toast('옮긴 문단·큐를 찾지 못해 다시 실행하지 못했습니다'); return true; }
  e.seq = ++UNDO_SEQ; m.undo.push(e);
  e.scenes.forEach(s => { const u = UNDO.get(s); if (u) { u.redo = []; u.t = 0; } });
  toast('옮기기를 다시 실행했습니다');
  return true;
}
// 편집기 undo() 가 먼저 묻는다: 이 씬에서 가장 최근 일이 끌어 옮기기면 그것을 되돌리고 true
function dndUndoTurn(doc, redo) {
  const m = mvBox(), sid = doc.dataset.scene, list = redo ? m.redo : m.undo;
  let e = null; for (let k = list.length - 1; k >= 0; k--) if (list[k].scenes.includes(sid)) { e = list[k]; break; }
  if (!e) return false;
  const u = undoBox(doc), top = (redo ? u.redo : u.stack).slice(-1)[0];
  if (top && (top.seq || 0) > (redo ? e.rseq : e.seq)) return false;
  return redo ? dndRedoStep(sid) : dndUndoStep(sid);
}
// 편집기·입력칸 밖(손잡이·빈 곳·버튼)의 Ctrl+Z / Ctrl+Y · Ctrl+Shift+Z — 끌어 옮기기와 삭제를 한 줄의 기록처럼(UNDO_SEQ 가 더 큰 것부터).
// 글자를 고치는 곳(입력칸·편집기·contenteditable)에서는 그곳의 되돌리기 그대로 — 대본 편집기는 undo() 가 그 씬의 삭제·이동도 본다.
// 다시 실행은 이동만 (삭제를 다시 하려면 다시 지운다)
document.addEventListener('keydown', ev => {
  const mod = ev.ctrlKey || ev.metaKey, k = ev.key;
  const isZ = undoKey(ev), isY = redoKey(ev);
  if (!mod || ev.altKey || !(isZ || isY)) return;
  if (!state.show || state.modal || GATE.type) return;
  const t = ev.target;
  if (t && t.closest && (t.closest('.doc, .ce, .modal') || t.isContentEditable || t.matches('input, textarea, select'))) return;
  const redo = isY || ev.shiftKey, m = mvBox();
  // 이동 기록은 대본·큐시트에서만 (큐 이동은 문단 순서를 바꾸지 않아 대본 편집기 없이 되돌릴 수 있다). 삭제는 편집 모드면 어느 뷰에서나
  const mvHere = state.view === 'script' || state.view === 'cuesheet';
  if (redo) {
    if (!mvHere || !m.redo.length) return;
    ev.preventDefault();
    if (!dndRedoStep(null)) toast('다시 실행할 것이 없습니다');
    return;
  }
  const del = state.edit ? DEL.filter(x => x.after).slice(-1)[0] : null;
  const pick = undoPick(mvHere ? m.undo[m.undo.length - 1] : null, del);
  if (!pick) return;
  ev.preventDefault();
  if (pick === 'del') undoDelete(del); // 못 되돌리면 알림으로 까닭을 (편집기 밖이라 넘겨줄 글 되돌리기가 없다)
  else if (!dndUndoStep(null)) toast('되돌릴 것이 없습니다');
});

/* ================= 시작 ================= */
// http(s) 로 열렸으면 서버를 먼저 찾는다. 없으면(아티팩트·file://·정적 호스팅) 지금까지처럼 로컬 모드
loadPrefs();
if (/^https?:$/.test(location.protocol)) {
  showGate('loading');
  // 서버가 안 보여도 지금 프로젝트가 공연 모드로 준비돼 있으면 이 기기의 사본으로 연다(오프라인 새로고침 — sw.js 가 화면을 준다)
  detectServer().then(h => { if (h) serverBoot(h).catch(bootFail); else smOfflineBoot().then(ok => { if (!ok) localBoot(); }, () => localBoot()); });
} else localBoot();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (mountedView === 'script') queuePaint(); });
})();
</script>
