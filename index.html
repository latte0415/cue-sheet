<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- ARTIFACT:START -->
<title>공연 큐시트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* 흰 바탕 + 중립 회색(zinc) + 포인트 컬러 하나(--accent). 빨강(--red)은 미정·미해결·삭제에만 */
:root{
  --paper:#ffffff; --tint:#f4f4f5; --tint-2:#fafafa;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#71717a;
  --rule:#e4e4e7; --rule-2:#d4d4d8;
  --accent:#2563eb; --accent-tint:#eef3fe; --on-accent:#ffffff;
  --red:#dc2626;
  /* 부서 글자색: 대본 큐 블록의 부서 열. 색만으로 구분하지 않고 부서 이름을 항상 같이 쓴다 */
  --q-cast:#7a4bc2; --q-light:#a85d0b; --q-sound:#0d7a6f; --q-stage:#57606d;
  --overlay:rgba(9,9,11,.28);
  --sans:Pretendard,"Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,Pretendard,"Pretendard Variable","Noto Sans KR",monospace;
  --gut:76px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b0b0c; --tint:#18181b; --tint-2:#111113;
    --ink:#ececef; --ink-2:#a1a1aa; --ink-3:#85858e;
    --rule:#232327; --rule-2:#38383e;
    --accent:#5b9bff; --accent-tint:#13203a; --on-accent:#0b0b0c;
    --red:#f87171;
    --q-cast:#b49cf0; --q-light:#e0a45a; --q-sound:#52c2b4; --q-stage:#9ea7b3;
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0b0b0c; --tint:#18181b; --tint-2:#111113;
  --ink:#ececef; --ink-2:#a1a1aa; --ink-3:#85858e;
  --rule:#232327; --rule-2:#38383e;
  --accent:#5b9bff; --accent-tint:#13203a; --on-accent:#0b0b0c;
  --red:#f87171;
  --q-cast:#b49cf0; --q-light:#e0a45a; --q-sound:#52c2b4; --q-stage:#9ea7b3;
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
/* 부스 모드: 다크 고정 + 순흑 배경 + 대비를 한 단계 낮춤 (암전 중 부스 화면 밝기) */
:root.booth[data-theme="dark"]{
  --paper:#000000; --tint:#0d0d0f; --tint-2:#070708;
  --ink:#c4c4ca; --ink-2:#8b8b93; --ink-3:#6a6a72;
  --rule:#18181b; --rule-2:#2a2a2f;
  --accent:#4f86e0; --accent-tint:#0c1628; --on-accent:#000000;
  --red:#d55c5c;
  --q-cast:#9282c2; --q-light:#b98a4f; --q-sound:#449c91; --q-stage:#7f8792;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;letter-spacing:-.005em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.txt{font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);padding:5px 8px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
textarea{resize:vertical}
input[type=checkbox]{accent-color:var(--accent);margin:0 5px 0 0;vertical-align:-2px}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:none}
input[type=color]{padding:0 2px;width:40px;height:30px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-tint)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.red{color:var(--red)}
.muted{color:var(--ink-3)}
.sm{font-size:12px}

/* 버튼: 1px 테두리 사각 또는 텍스트 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--paper);padding:4px 11px;font-size:13px;font-weight:500;line-height:1.45;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:var(--tint-2)}
.btn.strong{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.strong:hover{border-color:var(--accent);background:var(--accent);opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.tb{font-size:13px;color:var(--ink-2);white-space:nowrap;border-bottom:1px solid transparent;line-height:1.4}
.tb:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default;border-bottom-color:transparent;color:var(--ink-2)}
.tb.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tb.red,.btn.red{color:var(--red)}
.tb.red:hover{border-bottom-color:var(--red)}
.armed{color:var(--red)!important;border-color:var(--red)!important;font-weight:500}
.lbl{font-size:12px;color:var(--ink-3)}
.dl{font-size:12px;color:var(--ink-3);white-space:nowrap}
.empty{color:var(--ink-3);font-size:13px;padding:10px 0;margin:0}
.chk{display:inline-flex;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}

/* ---------- 골격 ---------- */
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 24px;border-bottom:1px solid var(--rule);padding-top:10px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1 1 180px;padding-bottom:9px}
.show-title{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{font-size:14px;color:var(--ink-3);padding:4px 0 8px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tools-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-left:auto;padding-bottom:8px}
.role-sel{border:0;border-bottom:1px solid var(--rule-2);padding:1px 2px;background:transparent;font-size:13px;max-width:150px}
.mode{display:inline-flex;gap:8px;align-items:baseline;font-size:13px}
.mode .sep{color:var(--rule-2)}
.count{color:var(--red);font-family:var(--mono);font-weight:500;font-size:12px;margin-left:4px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--rule-2);min-width:200px;z-index:30}
.menu button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--rule)}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:var(--tint)}
.nav-toggle{display:none}
.body{flex:1;min-height:0;display:flex}
.nav{width:210px;flex:none;overflow:auto;border-right:1px solid var(--rule);padding:12px 14px 40px 0}
.main{flex:1;min-width:0;overflow:auto;padding:0 0 90px 28px;scroll-padding-top:8px}
.panel{width:340px;flex:none;overflow:auto;border-left:1px solid var(--rule);padding:12px 0 30px 16px}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:35}

/* ---------- 내비 ---------- */
.nav ol{list-style:none;margin:0;padding:0}
.nav-check{display:block;font-size:12px;color:var(--ink-3);padding:0 0 8px}
.nav-check:hover{color:var(--accent)}
.nav-pre{font-size:12px;color:var(--ink-3);padding:2px 0 8px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.nav-part{font-size:12px;font-weight:500;color:var(--ink-3);padding:16px 0 6px}
.nav-scene{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:6px 0 6px 10px;font-size:13px;color:var(--ink);box-shadow:inset 2px 0 0 transparent}
.nav-scene:hover{background:var(--tint-2)}
.nav-scene.cur{font-weight:500;background:var(--tint);box-shadow:inset 2px 0 0 var(--accent)}
.nav-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-k{font-size:11px;color:var(--ink-3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.nav-k b{color:var(--red);font-weight:400}
/* 진행: 액트 사이를 잇는 작은 연결 줄 — 들여쓰기 + 짧은 세로 점선 */
.nav-scene.mc{position:relative;padding:2px 0 2px 26px;font-size:12px;color:var(--ink-3);line-height:1.5;box-shadow:none}
.nav-scene.mc::before{content:"";position:absolute;left:15px;top:0;bottom:0;border-left:1px dashed var(--rule-2)}
.nav-scene.mc:hover{color:var(--ink);background:none}
.nav-scene.mc.cur{color:var(--accent);background:none;font-weight:400}
.nav-scene.mc.cur::before{border-left:1px solid var(--accent)}
.nav-scene.mc .nav-k{font-size:11px}

/* ---------- 대본 (문서 편집기) ---------- */
.script{max-width:780px;padding:4px 0 0 var(--gut)}
.preshow{font-size:13px;color:var(--ink-2);padding:14px 0 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ce{outline:0;min-width:2em}
.ce:empty::before{content:attr(data-ph);color:var(--ink-3)}
.ro .ce:empty::before{content:""}
.part-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;border-bottom:1px solid var(--ink);padding:30px 0 6px}
.pt-no{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.pt-name{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.hov{display:inline-flex;flex-wrap:wrap;gap:4px 12px;opacity:0;transition:opacity .12s}
.part-h:hover .hov,.part-h:focus-within .hov,.sc-head:hover .hov,.sc-head:focus-within .hov,.hov.keep{opacity:1}
@media (hover:none){.hov{opacity:1}}
.rest{display:contents}
.scene{padding:26px 0 6px;scroll-margin-top:8px}
.sc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;border-bottom:1px solid var(--rule-2);padding-bottom:5px}
.sc-title{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.sc-meta{font-size:12px;color:var(--ink-3)}
/* 진행 씬: 큰 제목 대신 얇은 괘선 + 작은 회색 이름 */
.scene.mc{padding-top:16px}
.scene.mc .sc-head{border-bottom:1px dashed var(--rule-2);padding-bottom:3px}
.scene.mc .sc-title{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.01em}
.ro .scene.mc .sc-title:empty::before{content:attr(data-ph)}
.sc-setup{font-size:12px;color:var(--ink-3);padding-top:3px}
.sc-props{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 0;border-bottom:1px dashed var(--rule-2);font-size:13px}
.sc-props label{display:inline-flex;align-items:center;gap:6px}
.sc-props .grow{flex:1 1 220px}
.sc-props .grow input{flex:1}
.in-num{width:58px}
.sc-props input[type=text],.sc-props input[type=number]{border:0;border-bottom:1px solid var(--rule-2);background:transparent;padding:2px 0}
.sc-props input:focus{border-bottom-color:var(--accent)}
.cast-edit{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.sheet{position:relative;margin-top:12px}
.gutter{position:absolute;left:calc(-1 * var(--gut));top:0;width:calc(var(--gut) - 10px)}
.g{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:flex-end;border-right:2px solid transparent;padding-right:7px}
.g.has-q{border-right-color:var(--accent)}
.g.tbd{border-right-style:dashed}
.g.other{opacity:.35}
.g-open{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono);font-size:11px;line-height:1.3;color:var(--ink-3);padding-top:6px;text-align:right;width:100%;white-space:nowrap}
.g.has-q .gq{color:var(--accent);font-weight:500}
.g .gc.open{color:var(--red)}
.g.sel .g-open{text-decoration:underline}
.g:hover,.g:focus-within{z-index:2}
.g-del{font-size:11px;color:var(--red);border-bottom:1px solid var(--red);margin-top:2px;white-space:nowrap;background:var(--paper)}
.doc{outline:0;font-family:var(--sans);font-size:16px;line-height:1.7;caret-color:var(--accent);min-height:1.7em}
.doc p{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere;position:relative;padding:2px 4px 2px 10px} /* 왼쪽 10px = 큐 줄의 부서 괘선(2px)+들여쓰기(8px)와 글자 줄 맞춤 */
.doc p.k-action{color:var(--ink-2)}
.doc .spk{font-weight:600;font-size:14px;letter-spacing:0}
.doc .paren{color:var(--ink-3)}
.doc p.sel{background:var(--tint)}
.ro .doc p.sel{background:none}
.doc p.dim{color:var(--ink-3)}
.ro{--gut:52px}
.ro .g-open{font-size:10px;padding-top:7px}
.doc[data-empty]::before{content:attr(data-empty);position:absolute;left:10px;top:2px;color:var(--ink-3);pointer-events:none}
.ro .g{padding-right:5px}
/* 큐 블록: 큐가 달린 문단 위에 한 큐 한 줄 — [부서 열] 내용(진하게) 미정 시점 · 메모(작게 회색). 그 아래 문단 본문은 보통 굵기 */
.qlayer{position:absolute;left:0;right:0;top:0;height:0;z-index:1}
.qb{position:absolute;left:0;right:4px;display:block;padding:2px 0 2px;text-align:left}
.doc p.has-qb{padding-top:calc(var(--qh, 0px) + 1px);margin-top:10px}
/* 큐 숨기기: 큐 줄과 그 자리(--qh 여백)를 빼고 대사만 — 거터의 Q 번호는 남긴다 */
.hide-cues .qlayer{display:none}
.hide-cues .doc p.has-qb{padding-top:2px;margin-top:0}
.ql{display:grid;grid-template-columns:2.4em minmax(0,1fr);column-gap:10px;align-items:baseline;font-size:14px;line-height:1.5;color:var(--ink)}
.ql .qd{font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.ql.d-cast .qd{color:var(--q-cast)}
.ql.d-light .qd{color:var(--q-light)}
.ql.d-sound .qd{color:var(--q-sound)}
.ql.d-stage .qd{color:var(--q-stage)}
.ql .qx{min-width:0;overflow-wrap:anywhere}
.ql .qt{font-weight:600}
.ql .qs{font-size:12px;font-weight:600;color:var(--red);margin-left:8px;white-space:nowrap}
.ql .qt.tbd{color:var(--red)}
.ql .qm{font-size:12px;color:var(--ink-3);margin-left:8px}
.ql .qn{font-family:var(--mono);font-size:11px;color:var(--accent);white-space:nowrap}
.ql.other .qt{font-weight:400;color:var(--ink-3)}
.ql.other .qd{color:var(--ink-3);font-weight:400}
/* 대본 큐 줄의 부서 구분: 줄마다 왼쪽 2px 부서색 괘선 (거터의 파란 선과 떨어진 본문 안쪽), 글자는 8px 들여 씀 — 본문 문단도 같은 폭만큼 들인다 */
.qb .ql{border-left:2px solid var(--dc, var(--rule-2));padding-left:8px}
.qb .ql.d-cast{--dc:var(--q-cast)}.qb .ql.d-light{--dc:var(--q-light)}.qb .ql.d-sound{--dc:var(--q-sound)}.qb .ql.d-stage{--dc:var(--q-stage)}
.qb .ql.other{--dc:var(--rule-2)}
.qb .ql+.ql{margin-top:1px}
.qb:hover .qt{text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
/* 끌어 옮기기 (편집 모드): 문단 손잡이는 본문 바로 왼쪽의 점선 두 줄, 놓을 곳은 문단 사이 가로 괘선 하나, 큐를 놓을 문단은 옅은 바탕 + 왼쪽 선 */
.dnd-h{position:absolute;left:-14px;z-index:3;width:14px;height:27px;display:flex;align-items:center;justify-content:center;color:var(--rule-2);cursor:grab;touch-action:none}
.dnd-h::before{content:"";width:2px;height:13px;border-left:2px dotted currentColor;border-right:2px dotted currentColor}
.dnd-h:hover,.dnd-h:focus{color:var(--accent);outline:0}
.dnd-h:focus-visible{box-shadow:inset 0 -1px 0 var(--accent)}
.ro .dnd-h{display:none}
@media (pointer:coarse){.dnd-h{left:-20px;width:20px;color:var(--ink-3)}}
.dnd-line{position:fixed;z-index:60;height:0;border-top:2px solid var(--accent);pointer-events:none}
.dnd-tag{position:fixed;z-index:61;max-width:280px;padding:0 6px;font-size:12px;line-height:1.6;color:var(--ink);background:var(--paper);border-left:2px solid var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.app.dnd-drag,.app.dnd-drag *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.doc p.dnd-src,.ql.dnd-src,.qb.dnd-src{opacity:.35}
.doc p.dnd-tgt{background:var(--accent-tint);box-shadow:inset 2px 0 0 var(--accent)}
.script:not(.ro) .qb .ql[data-cue]{cursor:grab}
.script:not(.ro) .qb .ql .qd{touch-action:none}
@media print{.dnd-h,.dnd-line,.dnd-tag{display:none!important}}

/* ---------- 큐시트 ---------- */
.cs-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:18px 0 10px}
.cs-top h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.note{font-size:12px;color:var(--ink-3);margin:0}
.table-wrap{overflow-x:auto;max-width:100%}
.cs-table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
.cs-table th,.cs-table td{padding:8px 10px 9px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.cs-table thead th{font-size:12px;font-weight:400;color:var(--ink-3);border-bottom:1px solid var(--rule-2);white-space:nowrap}
.cs-table thead th.col-mine{color:var(--ink);font-weight:500}
.cs-table tbody tr.row{cursor:pointer}
.cs-table tbody tr.row:hover td{background:var(--tint-2)}
.cs-table tbody tr.sel td{background:var(--tint)}
.cs-num{width:44px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);font-weight:500;border-left:2px solid transparent}
tr.tbd .cs-num{border-left:2px dashed var(--red)}
.cs-q{width:30%;min-width:240px}
.cs-ctx{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:380px}
.cs-trig{font-size:12px;color:var(--ink-3);margin:1px 0}
.cs-text{font-size:14px;line-height:1.6;white-space:pre-wrap}
.cs-text .spk{font-weight:600;font-size:13px;margin-right:5px}
.cs-text.k-action{color:var(--ink-2)}
.cs-text .paren{color:var(--ink-3)}
.cs-c{font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;margin-bottom:4px;overflow-wrap:anywhere}
.cs-c:last-child{margin-bottom:0}
.cs-ct{display:block;font-size:12px;color:var(--ink-3)}
.cs-cont{font-size:12px;color:var(--ink-3)}
.col-dim{opacity:.35}
.cs-memo{width:15%;min-width:150px;font-size:12px;color:var(--ink-2)}
.cs-memo div+div{margin-top:3px}
.cs-scene th{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding-top:14px;font-weight:400;scroll-margin-top:8px}
.cs-scene b{font-size:15px;font-weight:600;margin-right:10px}
.cs-scene .sc-meta{margin-right:12px}
/* 진행 구분 행: 얇게 */
.cs-scene.mc th{border-top:1px solid var(--rule-2);padding-top:5px;padding-bottom:5px}
.cs-scene.mc b{font-size:12px;font-weight:500;color:var(--ink-3);margin-right:8px}
.cs-pre td{font-size:12px;color:var(--ink-2)}
.cs-none td{color:var(--ink-3);font-size:12px}
.play{font-size:12px;color:var(--accent);border-bottom:1px solid var(--accent);margin-right:6px;white-space:nowrap}
.play:hover{opacity:.8}
.play.nofile{color:var(--ink-3);border-bottom:1px dashed var(--rule-2)}

/* ---------- 런 ---------- */
.run{max-width:860px;margin:0 auto;padding:18px 0}
.run-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.run-pos{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--accent);line-height:1.1}
.run-of{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.run-where{font-size:13px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.run-mine{margin-left:auto}
.run-mine.disabled{opacity:.45;cursor:default}
.run-prog{height:1px;background:var(--rule);margin:10px 0 0}
.run-prog i{display:block;height:2px;margin-top:-.5px;background:var(--accent)}
.run-ctx{font-size:14px;color:var(--ink-3);padding:10px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.run-ctx .spk{font-weight:600;font-size:13px;margin-right:5px}
.run-cur{border-top:2px solid var(--accent);border-bottom:1px solid var(--rule-2);padding:14px 0 6px}
.run-trig{font-size:13px;color:var(--ink-2)}
.run-text{font-size:clamp(20px,3.2vw,28px);font-weight:500;letter-spacing:-.015em;line-height:1.5;margin:6px 0 12px;overflow-wrap:anywhere;white-space:pre-wrap}
.run-text.k-action{color:var(--ink-2)}
.run-text .spk{font-weight:600;font-size:.62em;letter-spacing:0;margin-right:8px;color:var(--ink-2)}
.run-cues{border-collapse:collapse;width:100%}
.run-cues th,.run-cues td{border-top:1px solid var(--rule);padding:10px 10px 10px 0;text-align:left;vertical-align:top}
.run-cues th{width:56px;font-weight:400}
.rc-sum{font-size:18px;font-weight:500;line-height:1.4;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rc-trig{font-size:12px;color:var(--ink-3)}
.rc-memo{font-size:12px;color:var(--ink-2)}
.rc-a{text-align:right!important;white-space:nowrap}
.rc-a .btn{margin:0 0 4px 6px}
.run-cues tr.other .rc-sum{font-size:13px;color:var(--ink-3)}
.run-cues tr.other{opacity:.6}
.run-next{padding:12px 0;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.run-next b{font-weight:600}
.run-next .rn-c{font-size:12px;color:var(--ink-3)}
.run-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.run-btns .btn{justify-content:center;min-height:56px;font-size:16px}
.run-foot{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:12px 0 0}
.run-hint{font-size:12px;color:var(--ink-3);margin:0;flex:1;min-width:0;text-align:right}
.run-opts{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font-size:12px;padding-top:6px}
.run-chk{font-size:12px;color:var(--red);border-bottom:1px solid var(--red)}
@media (hover:none) and (pointer:coarse){.run-keys{display:none}}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-2);padding:0 4px;color:var(--ink-2)}
.cd{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.cd-n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:min(46vmin,340px);line-height:1;font-weight:500}
.cd-l{font-size:15px;color:var(--ink-2);text-align:center;max-width:640px;overflow-wrap:anywhere}
.cd.zero .cd-n{color:var(--accent)}
.cd.flash::after{content:"";position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none;animation:cdflash .8s ease-out 1}
@keyframes cdflash{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}
/* 부스 모드: 전면 플래시 대신 숫자만 한 번 깜박 */
.cd.flash-num .cd-n{animation:cdblink .7s steps(1,end) 1}
@keyframes cdblink{0%{opacity:1}35%{opacity:.12}70%{opacity:1}}

/* ---------- 사람 / 음원 ---------- */
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:20px 0 8px;border-bottom:1px solid var(--rule-2)}
.sec-h h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.ltable{border-collapse:collapse;width:100%;font-size:13px}
.ltable th,.ltable td{padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.ltable thead th{font-size:12px;font-weight:400;color:var(--ink-3);white-space:nowrap}
.ltable .n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:16px}
.ltable tr.mine td{background:var(--tint)}
.ltable input[type=text],.ltable input[type=number],.ltable select{border:0;border-bottom:1px solid var(--rule-2);background:transparent;padding:3px 0}
.ltable input:focus,.ltable select:focus{border-bottom-color:var(--accent)}
.pp-table{min-width:760px}
.pp-name{font-size:14px;font-weight:600}
.pp-scenes button{font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--rule-2);margin-right:8px}
.pp-scenes button:hover{color:var(--accent);border-bottom-color:var(--accent)}
.matrix{min-width:520px}
.matrix td{text-align:center;font-family:var(--mono);font-size:12px}
.matrix th.mine,.matrix td.mine{background:var(--tint)}
.tr-table{min-width:900px}
.tr-table tr.no-file td{color:var(--ink-3)}
.tr-table tr.playing td{background:var(--accent-tint)}
.tr-table input[type=text]{width:100%;min-width:110px}
.tr-file{max-width:220px;overflow-wrap:anywhere}
.tr-table label{position:relative;overflow:hidden}
.tr-uses td{padding-left:16px}
.ref-link{display:block;font-size:12px;color:var(--ink-2);text-align:left;padding:2px 0;overflow-wrap:anywhere}
.ref-link:hover{color:var(--accent);text-decoration:underline}
.dropzone{border:1px dashed var(--rule-2);padding:10px 12px;margin:12px 0}
.dropzone.over{border-color:var(--accent);background:var(--accent-tint)}
.err{color:var(--red);font-size:13px;margin:4px 0}

/* ---------- 점검 ---------- */
.ck-sum{font-size:14px;color:var(--ink-2);padding:10px 0 0}
.ck-sum b{font-family:var(--mono);font-weight:500;color:var(--red)}
.ck-sum.ok b{color:var(--accent)}
.ck-g{padding:14px 0 4px;border-bottom:1px solid var(--rule)}
.ck-g h3{margin:0 0 4px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.ck-g h3 .n{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--red)}
.ck-g h3 .n.zero{color:var(--ink-3);font-weight:400}
.ck-g .note{margin-bottom:4px}
.ck-g ol{list-style:none;margin:0;padding:0}
.ck-g li{border-top:1px solid var(--rule)}
.ck-g li:first-child{border-top:0}
.ck-g .ref-link{font-size:13px;padding:6px 0 6px 10px;border-left:2px solid var(--red);width:100%}

/* ---------- 패널 ---------- */
.pn-h{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--rule-2)}
.pn-tabs{display:flex;gap:16px;flex:1}
.pn-tabs button{font-size:13px;color:var(--ink-3);padding:2px 0 7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.pn-tabs button:hover{color:var(--ink)}
.pn-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.pn-h .tb{margin-bottom:6px}
.pn-ref{padding:10px 0;border-bottom:1px solid var(--rule)}
.pn-ref .txt{font-size:15px;line-height:1.6;overflow-wrap:anywhere;margin-top:2px}
.pn-sec{padding:12px 0 6px}
.pn-sec h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--ink-3)}
.pn-cues,.cmts{list-style:none;margin:0 0 10px;padding:0}
.pn-cues li{border-top:1px solid var(--rule);padding:8px 0 8px 10px;border-left:2px solid var(--accent)}
.pn-cues li.tbd{border-left-style:dashed}
.pn-cues li.sel{background:var(--tint)}
.pc-top{display:flex;gap:10px;align-items:baseline}
.pc-sum{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.pc-trig{font-size:12px;color:var(--ink-3);margin-top:2px}
.pc-memo{font-size:12px;color:var(--ink-2);margin-top:2px}
.pc-a{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.cmts li{border-top:1px solid var(--rule);padding:8px 0 8px 10px;border-left:2px solid var(--red)}
.cmts li.resolved{border-left-color:var(--rule-2);color:var(--ink-2)}
.cmt-h{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.cmt-h time{color:var(--ink-3)}
.cmts p{margin:3px 0 5px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.cmt-a{display:flex;gap:14px}
.cmt-form{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.cmt-form .row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.cmt-form .row input{flex:1}
.pn-del{border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}
.cmts li[data-act]{cursor:pointer}
.cmts li[data-act]:hover{background:var(--tint-2)}
/* 코멘트 위치 강조: 위아래 괘선 + 배경이 옅어진다 (표 행은 칸에) */
.cmt-hit,tr.cmt-hit>td,tr.cmt-hit>th{animation:cmt-hit 2.4s ease-out}
tr.cmt-hit{animation:none}
@keyframes cmt-hit{0%,50%{background:var(--accent-tint);box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}100%{background:transparent;box-shadow:inset 0 1px 0 transparent,inset 0 -1px 0 transparent}}
@media (prefers-reduced-motion: reduce){.cmt-hit:not(tr),tr.cmt-hit>td,tr.cmt-hit>th{background:var(--accent-tint);box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}}
.rv-c{margin:0;font-size:13px;border-left:2px solid var(--red);padding-left:10px;overflow-wrap:anywhere}
.rv-c time{color:var(--ink-3);font-size:12px}
.rv-ref{margin:0;font-size:12px;color:var(--ink-3)}
.rv-t{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rv-t th,.rv-t td{border-top:1px solid var(--rule);padding:6px 10px 6px 0;text-align:left;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}
.rv-t thead th{border-top:0;border-bottom:1px solid var(--rule-2);font-size:12px;font-weight:500;color:var(--ink-3)}
.rv-t thead th:first-child,.rv-t .rv-k{width:5.5em}
.rv-t .rv-k{font-size:12px;font-weight:400;color:var(--ink-3)}
.rv-t .rv-out{color:var(--ink-3);text-decoration:line-through}

/* ---------- 모달 / 토스트 / 플레이어 ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.modal{background:var(--paper);border:1px solid var(--rule-2);width:min(660px,100%);margin-block:auto;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:baseline;gap:8px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.modal-h h2{margin:0;font-size:15px;font-weight:600;flex:1;min-width:0}
.modal-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid var(--rule);justify-content:flex-end;align-items:center}
.modal-f .left{margin-right:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:12px;color:var(--ink-2)}
.m-ref{font-size:13px;color:var(--ink-2);border-left:2px solid var(--rule-2);padding-left:10px;overflow-wrap:anywhere}
.m-tabs{display:flex;gap:18px;border-bottom:1px solid var(--rule)}
.m-tabs button{font-size:14px;color:var(--ink-3);padding:2px 0 7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.m-tabs button:hover{color:var(--ink)}
.m-tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13px}
.ch-rows{border-top:1px solid var(--rule)}
.ch-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:end}
.ch-row .wide{grid-column:span 2}
.dimbox,.colorbox{display:flex;gap:6px;align-items:center}
.dimbox input[type=range]{flex:1;min-width:60px}
.dimbox input[type=number]{width:62px}
.colorbox input[type=text]{flex:1;min-width:0}
.code{font-family:var(--mono);font-size:12px;width:100%;min-height:260px}
.ag-blk{border-top:1px solid var(--rule);padding-top:10px}
.ag-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.ag-h h3{margin:0;font-size:13px;font-weight:600;flex:1}
.ag-pre{margin:0 0 6px;padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.ag-h h4{margin:0;font-size:12px;font-weight:400;color:var(--ink-2);flex:1}
.ag-sub{margin-top:14px}
.ag-blk>.ag-sub:first-child,.ag-blk>.ag-h+.ag-sub,.ag-once+.ag-sub{margin-top:0}
.ag-new{display:flex;gap:10px;align-items:center}
.ag-new input{flex:1}
.ag-once{margin:0 0 10px;padding-left:10px;border-left:2px solid var(--accent);font-size:13px}
.ag-tbl td:last-child{text-align:right;padding-right:0}
.ag-tbl .n{text-align:left;padding-right:10px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--player-h, 0px) + env(safe-area-inset-bottom, 0px));z-index:80;background:var(--ink);color:var(--paper);padding:8px 14px;font-size:13px;max-width:calc(100vw - 32px)}
body.has-player{--player-h:44px}
body.has-player .app{padding-bottom:calc(var(--player-h) + env(safe-area-inset-bottom, 0px))}
.player{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--rule-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));font-size:13px}
.pl-info{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1 1 160px}
.pl-no{font-family:var(--mono);font-weight:500;color:var(--accent)}
.pl-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.pl-ctrl{display:flex;align-items:center;gap:12px;flex:3 1 420px;min-width:0}
#pl-seek{flex:1;min-width:60px}
#pl-vol{width:80px}
.pl-time{font-family:var(--mono);font-size:12px;min-width:44px;text-align:right}
.pl-mini{font-family:var(--mono);font-size:12px;color:var(--accent)}
.toast .toast-a{color:var(--paper);border-bottom:1px solid var(--paper);margin-left:14px;font-weight:600}

/* ---------- 5차: 판 정보 / 이동 모드 / 런 씬 경계 / 코멘트 ---------- */
.rev{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap;min-width:0;flex:none}
.rev .ce{min-width:1em}
.rev .ce[contenteditable="true"]{border-bottom:1px dashed var(--rule-2)}
.rev .ce[contenteditable="true"]:focus{border-bottom-color:var(--accent)}
.menu button:disabled{opacity:.4;cursor:default;background:none}
.menu-note{margin:0;padding:8px 12px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--rule);max-width:240px;white-space:normal}
.movebar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:6px 10px;border-bottom:1px solid var(--accent);background:var(--accent-tint);font-size:13px}
.movebar b{font-weight:600}
/* 6차: 서버 동기화 상태 · 충돌 안내 · 프로젝트 목록 · 시작 화면 */
.sync-st{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.sync-st.red{color:var(--red)}
.syncbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:6px 10px;border-bottom:1px solid var(--red);background:var(--paper);color:var(--red);font-size:13px}
.syncbar b{font-weight:600}
.syncbar .btn{color:var(--ink)}
.syncbar .sync-list{flex:1 1 100%;margin:0;padding:0;list-style:none;color:var(--ink-2);font-size:12px}
.syncbar .sync-list li{padding:2px 0;border-top:1px solid var(--rule)}
.brand{position:relative}
.proj-btn{font:inherit;color:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px dashed var(--rule-2)}
.proj-btn:hover{border-bottom-color:var(--ink-3)}
.proj-btn .caret{font-size:11px;color:var(--ink-3);margin-left:4px}
.proj-menu{position:absolute;left:0;top:calc(100% - 4px);z-index:40;background:var(--paper);border:1px solid var(--rule-2);width:min(420px,calc(100vw - 16px));max-height:min(70vh,560px);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.pj-h{display:flex;align-items:baseline;gap:8px;font-weight:600}
.pj-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.pj-i{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.pj-i .pj-open{flex:1 1 160px;min-width:0;text-align:left;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-i.cur .pj-open{font-weight:600;color:var(--accent)}
.pj-i .note{flex:1 1 100%;order:3}
.pj-a{display:inline-flex;gap:12px}
.pj-new{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pj-new input,.gate-box input,.proj-menu .field input{min-width:0;border:1px solid var(--rule-2);padding:5px 7px;font:inherit;background:var(--paper);color:var(--ink)}
.pj-new input{flex:1 1 160px}
.gate-box input,.proj-menu .field input{width:100%}
.gate{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px}
.gate-box{width:min(440px,100%);margin-top:10vh;border:1px solid var(--rule-2);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.gate-box h2{margin:0;font-size:16px;font-weight:600}
.gate-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.gate-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.gate-list li{border-bottom:1px solid var(--rule)}
.gate-list button{display:block;width:100%;text-align:left;padding:8px 2px;font-size:14px}
.gate-list button:hover{background:var(--tint)}
.gate-list .note{display:block}

<script>
(function () {

/* ================= 상수 ================= */

const VIEW_L = { script: '대본', cuesheet: '큐시트', run: '런', stage: '무대 상황', people: '사람', props: '소품', tracks: '음원', check: '점검' };
const SHOW_VER = 6; // v6: 소품 목록(props) · 공연 전 무대 소품(preShowProps) · 무대 큐 소품 동작(stage.props)
const FADE_DEFAULT = 3; // fadeOut 시간이 비어 있을 때 쓰는 기본 페이드(초)
const THEMES = ['system', 'light', 'dark'];
const THEME_L = { system: '시스템', light: '라이트', dark: '다크' };
const TRIGGER_HINTS = ['대사 끝', '호명 후', '암전 후', '이전 큐 후', '씬 시작', '인사 후', '퇴장 후', '액트 도중(시점 미정)'];
// 문단 문법: ( * — – -- 로 시작하면 동작 / "이름: 대사" / (알려진 사람) 이름 "대사"
const ACT_RE = /^\s*(\(|（|\*|—|–|--)/;
const SPK_RE = /^(\s*([^\s:：()（）"“'*—–\-[][^\s:：()（）"“]{0,11})\s*[:：])([\s\S]*)$/;
const QSPK_RE = /^(\s*([^\s:：()（）"“'*—–\-[][^\s:：()（）"“]{1,11}))(\s+(?:\([^)]*\)\s*)?["“][\s\S]*)$/;

/* ================= 유틸 ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function uid(p) { return (p || 'x') + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// 본문 텍스트 노드용 — 브라우저 innerHTML 직렬화와 같은 규칙(& < > 만)
function escT(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function num(v) { if (v === '' || v == null) return null; const n = Number(v); return Number.isFinite(n) ? n : null; }
function safeHex(c) { return /^#[0-9a-fA-F]{6}$/.test(c || '') ? c : null; }
function cut(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function cssq(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&'); }
function fmtTime(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = x => String(x).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtMin(sec) {
  if (sec == null || !isFinite(sec)) return '';
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  if (!m) return s + '초';
  return m + '분' + (s ? ' ' + s + '초' : '');
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
function moveIn(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return false; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; return true; }

/* ================= 샘플 데이터: 실제 큐시트 (1부 초안, 미완성) ================= */
function sampleShow() {
  const P = { yj: 'p-yejun', dh: 'p-daehoon', th: 'p-taehyung' };
  const people = [
    { id: P.yj, name: '조예준', role: 'mc', note: 'MC 겸 공연자' },

    { id: P.th, name: '라태형', role: 'performer', note: '' }
  ];
  let n = 0;
  const id = p => p + '-' + (++n).toString(36);
  const t0 = Date.parse('2026-11-15T20:00:00+09:00');
  const cm = (author, text, resolved, mins) => ({ id: id('c'), author, text, createdAt: new Date(t0 + mins * 60000).toISOString(), resolved: !!resolved, resolvedBy: null, resolvedAt: null });
  const ch = (c, action) => ({ ch: c, action, dim: null, color: null, colorName: null, timeSec: null });
  const Q = (dept, trigger, offsetSec, body, o) => { o = o || {}; const c = { id: id('q'), dept, trigger, offsetSec: offsetSec == null ? null : offsetSec, memo: o.memo || '', status: o.tbd ? 'tbd' : 'set' }; c[dept] = body; return c; };
  const Lt = (trig, off, channels, o) => Q('light', trig, off, { channels, anim: '' }, o);
  const Sd = (trig, off, track, action, o) => Q('sound', trig, off, { track, action, timeSec: (o && o.time) != null ? o.time : null, level: (o && o.level) != null ? o.level : null }, o);
  const St = (trig, off, text, o) => Q('stage', trig, off, { text, props: (o && o.props) || [] }, o);
  const PR = { table: 'pr-tophat-table', hat: 'pr-tophat', rope: 'pr-rope' };
  const props = [
    { id: PR.table, name: '탑햇테이블', note: '' },
    { id: PR.hat, name: '탑햇', note: '' },
    { id: PR.rope, name: '로프', note: '박대훈 묶는 용' }
  ];
  const Ca = (trig, off, personId, move, o) => Q('cast', trig, off, { personId, move, text: (o && o.text) || '' }, o);
  const it = (kind, speaker, text, cues, cms) => ({ id: id('i'), kind, speaker, text, label: null, isCue: !!(cues && cues.length), cues: cues || [], comments: cms || [] });
  const L = (spk, text, cues, cms) => it('line', spk, text, cues, cms);
  const A = (text, cues, cms) => it('action', null, text, cues, cms);
  const S = (type, title, cast, durationSec, items) => ({ id: id('s'), type, title, cast, durationSec, setup: '', items, comments: [] });
  const BLACK = () => [ch('back', 'off'), ch('top', 'off'), ch('front', 'off'), ch('house', 'off')];

  const parts = [{ id: id('pt'), name: '1부', scenes: [
    // 하우스 오픈: 객석이 열릴 때부터 하우스 음악(반복 재생)을 틀어 두는 자리
    S('mc', '하우스 오픈', [], null, [
      A('(하우스 오픈 — 하우스 음악 시작)', [Sd('객석 오픈', null, 1, 'play')])
    ]),
    S('mc', '', [P.yj], null, [
      A('(하우스 음악 올림)', [
        Sd('공연 시작', null, 1, 'volume', { level: 100, time: 3 }),
        Lt('하우스 음악 커지면', null, [ch('house', 'off')]),
        Sd('객석 Off 후', null, 1, 'fadeOut')
      ]),
      A('(암전)', [Lt('하우스 페이드 아웃 후', null, BLACK())]),
      A('(조예준 인)', [Ca('암전 후', null, P.yj, 'in')]),
      A('(암전 7초 후 조명 On — 조명 상세 미정)', [Lt('암전 후', 7, [], { tbd: true })],
        [cm('초안', '조명 상세 미정 — 조명팀 확인 필요', false, 0)]),
      A('(예준 스냅 주면 노래 시작)', [Sd('예준 스냅 주면', null, 2, 'play')])
    ]),
    S('act', '제로존', [P.yj], 60, []),
    S('mc', '', [P.yj], null, [
      A('(예준 인사 멘트)'),
      L(P.yj, '안녕하세요, 오늘 공연 진행을 맡은 조예준입니다.'),
      L(P.yj, '오늘 1부는 저를 포함해서 총 3명의 공연자와 함께 할 예정인데, 남은 2명을 한명씩 소개해볼까 합니다.'),
      L(P.yj, '그럼 준비되셨을까요?'),
      L(P.yj, '소개합니다 박대훈'),
      A('(조예준 아웃)', [Ca("'소개합니다 박대훈' 후", null, P.yj, 'out')]),
      A('(멘트 끝나자마자 음원 시작)', [Sd('멘트 끝나자마자', null, 3, 'play')]),
      A('(박대훈 인)', [Ca('음원 시작 후', null, P.dh, 'in')])
    ]),
    S('act', '멘탈', [P.dh], 180, [
      A('* 액트 도중 조예준 인', [Ca('액트 도중(시점 미정)', null, P.yj, 'in', { tbd: true })],
        [cm('초안', '들어오는 시점 미정 — 리허설 때 정하기', false, 1)]),
      A('* 입에 테이프 뜯을 때, 음원 페이드 아웃', [Sd('입에 테이프 뜯을 때', null, 3, 'fadeOut')])
    ]),
    S('mc', '', [P.dh, P.yj], null, [
      L(P.dh, '와 답답해서 죽는 줄 알았네요 박대훈입니다. 자 입도 풀렸겠다 기대가 되는데요?'),
      L(P.yj, '다음 사람 소개해야….', [St('이 대사 즈음', null, '탑햇테이블에 탑햇 세팅', { props: [{ propId: PR.hat, action: 'in', at: '탑햇테이블 위' }] })]),
      L(P.dh, '(말 끊고) 다음 마술은 뭐죠? 뭐죠?'),
      L(P.yj, '(한숨 한 번 쉬고) 에휴 나가계세요 제가 진행할게요…'),
      A('(로프로 박대훈 묶음)'),
      A('(박대훈 아웃)', [Ca('묶은 후', null, P.dh, 'out')]),
      L(P.yj, '소개합니다 다음 공연자 라태형'),
      A('(암전)', [Lt("'라태형' 호명 후", null, BLACK())]),
      A('(조예준 아웃)', [Ca('암전 후', null, P.yj, 'out')]),
      A('(암전 7초 뒤에 조명 On + 음악 시작)', [Lt('암전 후', 7, [], { tbd: true, memo: '조명 상세 없음' }), Sd('암전 후', 7, 4, 'play')]),
      A('(라태형 인)', [Ca('조명 On 후', null, P.th, 'in')])
    ]),
    S('act', '카드 매니', [P.th], 180, []),
    S('mc', '', [P.yj, P.th], null, [
      A('(조예준 인)', [Ca('액트 후', null, P.yj, 'in')]),
      L(P.th, '(마이크 받아서 인사) 안녕하세요 라태형입니다')
    ])
  ] }];
  const T = (no, title, loop) => ({ id: 'tr-' + no, no, title, durationSec: null, fileName: null, fileKey: null, note: '', loop: !!loop });
  const tracks = [T(1, '하우스 음악', true), T(2, '제로존 음원'), T(3, '멘탈 음원'), T(4, '카드 매니 음원')];
  const show = { id: 'show-1bu-draft', title: '1부 (초안)', version: SHOW_VER, revision: '', updatedAt: new Date(t0).toISOString(), preShowSetup: '탑햇테이블', people, props,
    preShowProps: [{ propId: PR.table, at: '무대 중앙' }], tracks, parts };
  renumberLabels(show);
  return show;
}

/* ================= 큐 번호 ================= */
// Item.label = 큐가 붙은 문단의 번호. 늘 1부터 빈틈없이 순서대로 (소수 번호 없음, 큐 없는 문단은 null).
// 사용자가 편집해 저장할 때(save) 어긋나 있으면 다시 매긴다 — 큐 추가·삭제·이동(패널·끌어 옮기기), 문단 삭제·순서 변경 모두.
// 불러오기·렌더는 저장된 번호를 그대로 보인다(서버 MCP 가 매긴 번호도 편집 전에는 바꾸지 않는다). 번호가 빠진 문단이 있을 때만
// 화면용으로 채우고(fillLabels) 저장하지 않는다 — 다음 편집 때 함께 저장된다
function showItems(show) { const out = []; show.parts.forEach(p => p.scenes.forEach(s => s.items.forEach(i => out.push(i)))); return out; }
function renumberLabels(show) {
  let n = 0;
  showItems(show).forEach(i => { i.label = i.cues.length ? String(++n) : null; });
}
// 이미 1, 2, 3 … 순서대로인가 (큐 없는 문단은 번호 없음)
function labelsInOrder(show) {
  let n = 0;
  return showItems(show).every(i => i.cues.length ? i.label === String(++n) : i.label == null);
}
// 편집 저장 때: 어긋나 있으면 다시 매기고 true
function relabel(show) { if (labelsInOrder(show)) return false; renumberLabels(show); return true; }
// 불러오기·렌더 때: 큐가 있는데 번호가 없는 문단(번호 없이 올린 파일)이 있을 때만 화면용으로 채운다. 그 밖의 번호는 그대로
function fillLabels(show) { if (!showItems(show).some(i => i.cues.length && i.label == null)) return false; renumberLabels(show); return true; }

/* ================= 마이그레이션 / 정규화 ================= */
function migrate(raw) {
  const src = clone(raw);
  const ver = Number(src.version) || 1;
  const legacy = !Array.isArray(src.people) || ver < 2;
  const people = Array.isArray(src.people) ? src.people.filter(p => p && typeof p === 'object').map(p => ({
    id: String(p.id || uid('p')), name: String(p.name || '이름 없음'), role: ROLES[p.role] ? p.role : 'other', note: String(p.note || '')
  })) : [];
  const ids = new Set(people.map(p => p.id));
  const byName = new Map(people.map(p => [p.name, p]));
  function ensure(v, roleHint) {
    if (v == null || v === '') return null;
    v = String(v);
    if (ids.has(v)) return v;
    if (!legacy) return v; // v2+: 모르는 id 는 그대로 두고 "(삭제된 사람)" 으로 표시
    const name = v.trim(); if (!name) return null;
    let p = byName.get(name);
    if (!p) {
      p = { id: uid('p'), name, role: roleHint || (name.toUpperCase() === 'MC' ? 'mc' : 'performer'), note: '' };
      people.push(p); byName.set(name, p); ids.add(p.id);
    }
    return p.id;
  }
  // v6: 소품 참조 — 모르는 propId 도 지우지 않고 남겨 "(삭제된 소품)" 으로 표시 (사람 참조와 같은 방식). 빈 id 만 버린다
  const propRef = v => (v == null || v === '' ? null : String(v));
  const normPropActs = a => (Array.isArray(a) ? a : []).filter(x => x && typeof x === 'object' && propRef(x.propId))
    .map(x => ({ propId: propRef(x.propId), action: MOVES[x.action] ? x.action : 'in', at: String(x.at || '') }));
  function normCue(c) {
    c = c && typeof c === 'object' ? c : {};
    const dept = DEPTS.includes(c.dept) ? c.dept : 'stage';
    const out = { id: String(c.id || uid('q')), dept, trigger: String(c.trigger || ''), offsetSec: num(c.offsetSec), memo: String(c.memo || ''), status: c.status === 'tbd' ? 'tbd' : 'set' };
    if (dept === 'light') {
      const l = c.light || {};
      out.light = {
        channels: (Array.isArray(l.channels) ? l.channels : []).map(x => ({
          ch: CH.includes(x && x.ch) ? x.ch : 'front', action: L_ACT.includes(x && x.action) ? x.action : 'on',
          dim: num(x && x.dim), color: safeHex(x && x.color), colorName: x && x.colorName ? String(x.colorName) : (x && x.color && !safeHex(x.color) ? String(x.color) : null),
          timeSec: num(x && x.timeSec)
        })),
        anim: String(l.anim || '')
      };
    } else if (dept === 'sound') {
      const s = c.sound || {};
      const lv = num(s.level);
      out.sound = { track: num(s.track), action: S_ACT.includes(s.action) ? s.action : 'play', timeSec: num(s.timeSec), level: lv == null ? null : Math.round(Math.max(0, Math.min(100, lv))) };
    } else if (dept === 'stage') {
      out.stage = { text: String((c.stage && c.stage.text) || ''), props: normPropActs(c.stage && c.stage.props) };
    } else {
      const k = c.cast || {};
      out.cast = { personId: ensure(k.personId != null ? k.personId : k.name), move: MOVES[k.move] ? k.move : 'in', text: String(k.text || '') };
    }
    return out;
  }

  const last = new Map(), missing = [];
  IDX.entries.forEach(e => {
    const id = e.item.id;
    e.item.cues.forEach(c => {
      const sum = DEPT_L[c.dept] + ' ' + cueSummary(c);
      if (c.status === 'tbd') at('tbd').push({ item: id, text: `${ref(e)} — ${sum}` });

  let lines = 0, castCues = 0;

function agentText(k, key, ek) {
  const o = location.origin + '/mcp';
  // 비밀번호에 $ ` " \ ' 같은 기호가 있어도 붙여 넣은 그대로 전달되게: 셸은 작은따옴표로 감싸고(' 는 '\''), TOML 은 \ 와 " 를 이스케이프

  // 편집 비밀번호(이 브라우저가 아는 지금 프로젝트의 것)가 있으면 X-Edit-Key 헤더도 — 없으면 에이전트는 읽기만 된다 (agentEk)
  if (k === 'claude') return `claude mcp add --transport http cue-sheet ${shq(o)}` + (key ? ` --header ${shq('Authorization: Bearer ' + key)}` : '') + (ek ? ` --header ${shq('X-Edit-Key: ' + ek)}` : '');

  return `[mcp_servers.cue-sheet]\nurl = ${tomlq(o)}` + (hs.length ? `\nhttp_headers = { ${hs.join(', ')} }` : '');
}

// 복원 = 그 버전을 새 rev 로 저장. 먼저 이 기기의 대기분을 저장해(그것도 기록에 남는다) rev 를 맞춘 뒤 baseRev 로 보낸다

  const id = Srv.showId;

  $$('#hist-table [data-act="history-restore"]').forEach(b => { b.disabled = true; });
  const done = msg => { m.busy = false; $$('#hist-table [data-act="history-restore"]').forEach(b => { b.disabled = false; }); if (msg) setModalErr(msg); };
  if (!(await flushServer())) { done('저장되지 않은 변경이 있어 복원하지 않았습니다 — 상단 안내를 먼저 확인하세요'); return; }
  let r = null;
  try { r = await api('POST', showPath(id) + '/restore', { rev, baseRev: Srv.rev }); } catch (e) { r = null; }
  if (state.modal !== m || id !== Srv.showId) return;
  if (r && r.status === 409) { openHistory('그 사이 다른 기기에서 저장했습니다 — 목록을 새로 불러왔습니다. 다시 골라 주세요'); return; }
  if (!r || r.status !== 200) { done(editErrText(r, '편집 비밀번호가 맞지 않습니다 — 닫고 다시 잠금 해제하세요')); if (r && r.status === 403) render(); return; }
  let g = null;

  closeModal(true);
  if (g && g.status === 200 && g.data) applyRemote(g.data, true);
  if (r.data.unchanged) { toast(`지금 버전이 이미 rev ${rev} 과 같은 내용입니다`); return; }
  const lost = (r.data.warnings || []).length;
  toast(`rev ${rev} 을(를) 복원했습니다 — 새 rev ${r.data.rev}. 되돌리려면 버전 기록에서 rev ${r.data.rev - 1} 을 복원하세요${lost ? ` · 지워진 음원 ${lost}개는 연결을 비웠습니다` : ''}`, { ms: 6000 });
}

function saveCue() {

  if (!tbd) {
    if (d.dept === 'light' && !d.light.channels.length && !d.light.anim.trim()) err = '조명 채널을 하나 이상 추가하거나 애니메이션을 입력하세요 (아직 모르면 상태를 "미정"으로).';
    if (d.dept === 'sound' && d.sound.track == null) err = 'BGM 트랙 번호를 입력하세요.';
    if (d.dept === 'stage' && !d.stage.text.trim() && !d.stage.props.some(x => x.propId)) err = '무대 보조 내용이나 소품 동작을 하나 이상 입력하세요.';

  if (d.dept === 'light') cue.light = { channels: d.light.channels.map(c => ({ ch: c.ch, action: c.action, dim: c.dim, color: safeHex(c.color), colorName: c.colorName ? c.colorName.trim() || null : null, timeSec: c.timeSec })), anim: d.light.anim.trim() };
  else if (d.dept === 'sound') {

function act(a, el) {
  const S = state.show;
  switch (a) {
    case 'view': setView(el.dataset.view); render(); break;
    case 'role-pick': { const r = 'p:' + el.dataset.person; state.role = state.role === r ? 'all' : r; savePrefs(); render(); break; }
    case 'mode':
      // 서버 모드에서 편집 비밀번호를 모르면 먼저 묻는다
      if (el.dataset.mode === 'edit' && !canEdit()) { openUnlock({ then: 'edit' }); break; }
      state.edit = el.dataset.mode === 'edit'; state.sceneEdit = null; savePrefs(); render(); break;
    case 'panel-toggle': state.panel = !state.panel; if (state.panel && !state.selItem && state.panelTab !== 'scene') { if (state.panelTab !== 'all') markSeen(); state.panelTab = 'all'; } savePrefs(); renderTop(); renderPanel(); break;
    case 'panel-close': state.panel = false; savePrefs(); renderTop(); renderPanel(); break;
    case 'panel-tab': if (el.dataset.tab === 'all' && state.panelTab !== 'all') markSeen(); state.panelTab = el.dataset.tab; renderPanel(); break;
    case 'scene-cmts': {
      if (!IDX.byScene.has(el.dataset.scene)) break;
      state.panel = true; state.panelTab = 'scene'; state.panelScene = el.dataset.scene; state.panelFocus = 'comments';
      savePrefs(); renderTop(); renderPanel(); break;
    }
    case 'comment-goto-scene': if (innerWidth <= 1100) state.panel = false; savePrefs(); cmtJump({ scene: el.dataset.scene }); break;
    case 'undo-del': state.menuOpen = false; undoDelete(); break;
    case 'cue-move': {
      state.moveCue = { itemId: el.dataset.item, cueId: el.dataset.cue };
      if (innerWidth <= 1100) { state.panel = false; savePrefs(); }
      renderTop(); renderPanel(); break;
    }

  }
}

  } else {
    const f = dndFindCue(state.show, DND.id), p = dndParaAtY(dndNearestDoc(DND.y), DND.y);
    const t = p && f && p.dataset.id !== f.item.id ? p : null;
    if (DND.tgt !== t) { if (DND.tgt) DND.tgt.classList.remove('dnd-tgt'); if (t) t.classList.add('dnd-tgt'); DND.tgt = t; }
  }
}
// 가장자리 자동 스크롤 + 자리 다시 계산 (스크롤하면 같은 포인터 위치라도 자리가 바뀐다)
function dndLoop() {
  cancelAnimationFrame(DND.raf);
  const tick = () => {
    if (!DND.on || !DND.started) return;
    const m = $('#main'), r = m.getBoundingClientRect(), E = 56;
    let v = 0;
    if (DND.y < r.top + E) v = -Math.ceil((r.top + E - DND.y) / 3);
    else if (DND.y > r.bottom - E) v = Math.ceil((DND.y - (r.bottom - E)) / 3);
    if (v) m.scrollTop += Math.max(-28, Math.min(28, v));
    dndUpdate();
    DND.raf = requestAnimationFrame(tick);
  };
  DND.raf = requestAnimationFrame(tick);
}
function dndEnd(drop) {
  if (!DND.on) return;
  const { kind, id, started, slot, tgt, el, pid } = DND;
  DND.on = false; DND.started = false;
  cancelAnimationFrame(DND.raf);
  try { if (el && el.hasPointerCapture && el.hasPointerCapture(pid)) el.releasePointerCapture(pid); } catch (e) { /* 무시 */ }
  if (DND.src) DND.src.classList.remove('dnd-src');
  $$('#script .qb.dnd-src').forEach(x => x.classList.remove('dnd-src'));
  if (tgt) tgt.classList.remove('dnd-tgt');
  DND.src = null; DND.tgt = null; DND.slot = null;
  $('#app').classList.remove('dnd-drag');
  dndLine().hidden = true; dndTag().hidden = true;
  if (!started) return;
  DND.eatClick = true; setTimeout(() => { DND.eatClick = false; }, 0); // 끌고 난 뒤의 click(큐 블록 → 상세 열기)은 먹는다
  if (!drop || !dndOn()) return;
  if (kind === 'item' && slot && !slot.noop) dndMoveItem(id, slot.sceneId, slot.index, true);
  else if (kind === 'cue' && tgt) dndMoveCue(id, tgt.dataset.id);
}
document.addEventListener('pointermove', ev => {
  if (DND.on && ev.pointerId === DND.pid) {
    DND.x = ev.clientX; DND.y = ev.clientY;
    if (!DND.started) { if (Math.abs(DND.x - DND.x0) + Math.abs(DND.y - DND.y0) < 5) return; dndStart(); }
    if (ev.cancelable) ev.preventDefault();
    return;
  }
  // 마우스: 올린 문단 옆에 손잡이
  if (ev.pointerType !== 'mouse' || DND.on || !state.edit || mountedView !== 'script') return;
  const t = ev.target;
  if (dndH && t === dndH) return;
  const sheet = t && t.closest && t.closest('#script .sheet');
  const p = sheet ? dndParaAtY(sheet.querySelector('.doc'), ev.clientY) : null;
  if (p === DND.hoverP && (!p || (dndH && dndH._p === p && !dndH.hidden))) return;
  DND.hoverP = p;
  dndPlace(p || dndCaretP());
}, { passive: false });
document.addEventListener('pointerup', ev => {
  if (!DND.on || ev.pointerId !== DND.pid) return;
  const click = !DND.started && DND.el === dndH;
  if (DND.started) ev.preventDefault();
  dndEnd(true);
  if (click && dndH._p && !dndH.hidden) dndH.focus({ preventScroll: true }); // 손잡이를 누르기만 하면 포커스 → Alt+↑/↓
});
document.addEventListener('pointercancel', ev => { if (DND.on && ev.pointerId === DND.pid) dndEnd(false); });
document.addEventListener('keydown', ev => { if (DND.on && DND.started && ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); dndEnd(false); toast('옮기기를 취소했습니다'); } }, true);
// 큐 한 줄 잡기: 마우스는 줄 어디든, 터치·펜은 부서 열(.qd)만 — 나머지는 평소처럼 스크롤
document.addEventListener('pointerdown', ev => {
  const t = ev.target, ql = t && t.closest && t.closest('#script .qb .ql[data-cue]');
  if (!ql || !dndOn() || ev.button !== 0) return;
  if (ev.pointerType !== 'mouse' && !t.closest('.qd')) return;
  ev.preventDefault();
  dndBegin(ev, 'cue', ql.dataset.cue, ql, ql);
});
document.addEventListener('click', ev => { if (DND.eatClick) { ev.preventDefault(); ev.stopPropagation(); DND.eatClick = false; } }, true);
document.addEventListener('selectionchange', () => { if (!DND.on && !DND.hoverP) requestAnimationFrame(() => { if (!DND.on && !DND.hoverP) dndPlace(dndCaretP()); }); });
document.documentElement.addEventListener('mouseleave', () => { DND.hoverP = null; if (!DND.on) dndPlace(dndCaretP()); });

/* --- 옮기기 / 되돌리기 --- */
function dndPush(e) {
  const m = mvBox();
  e.seq = ++UNDO_SEQ; m.undo.push(e); if (m.undo.length > 120) m.undo.shift();
  m.redo = [];
  // 이 이동 전에 찍힌 그 씬들의 "다시 실행" 스냅숏은 이제 맞지 않는다. 다음 입력은 새 스냅숏부터
  e.scenes.forEach(sid => { const u = UNDO.get(sid); if (u) { u.redo = []; u.t = 0; } });
}
function dndSync(sids) { const a = document.activeElement; if (a && a.classList && a.classList.contains('doc') && sids.includes(a.dataset.scene)) syncDoc(a); }
// 바뀐 씬의 편집기를 모델대로 다시 그리고(docs), 번호·거터·머리말을 갱신하고 저장
function dndRedraw(sids, docs, focusId) {
  const a = document.activeElement, fdoc = a && a.classList && a.classList.contains('doc') ? a : null;
  buildIndex();
  if (docs) Array.from(new Set(sids)).forEach(sid => {
    const doc = dndDoc(sid), se = IDX.byScene.get(sid); if (!doc || !se) return;
    doc.innerHTML = se.scene.items.map(paraHtml).join('') || '<p><br></p>';
    Array.from(doc.children).forEach(p => { p._raw = textOf(p); });
    markEmpty(doc);
  });
  scriptSig = sig();
  commit();
  // 편집기 안에서 Ctrl+Z 로 되돌렸으면 커서를 옮긴 문단(없으면 첫 문단) 앞에
  if (docs && fdoc && fdoc.isConnected && document.activeElement === fdoc && sids.includes(fdoc.dataset.scene)) {
    const p = (focusId && fdoc.querySelector(`p[data-id="${cssq(focusId)}"]`)) || fdoc.firstElementChild;
    if (p) setCaret(p, 0);
  }
}
// focusHandle: 옮긴 문단의 손잡이에 포커스 (끌어 놓기·Alt+↑/↓ 뒤 — 이어서 Alt+↑/↓, Ctrl+Z)
function dndMoveItem(id, sceneId, index, focusHandle) {
  const at = dndFindItem(state.show, id); if (!at) return false;
  dndSync([at.scene.id, sceneId]);
  const labels = labelMap(state.show);
  const r = relocateItem(state.show, id, sceneId, index);
  if (!r || !r.changed) return false;
  renumberLabels(state.show);
  dndPush({ kind: 'item', id, from: r.from, to: r.to, labels, scenes: Array.from(new Set([r.from.sceneId, r.to.sceneId])) });
  dndRedraw([r.from.sceneId, r.to.sceneId], true, id);
  const p = dndPara(id);
  if (p) {
    p.scrollIntoView({ block: 'nearest' });
    if (focusHandle) { DND.hoverP = null; dndPlace(p); const h = dndHandle(); if (!h.hidden) h.focus({ preventScroll: true }); }
  }
  if (r.from.sceneId !== r.to.sceneId) { const se = IDX.byScene.get(r.to.sceneId); toast(`문단을 「${cut(se ? sceneTitle(se.scene) : '', 20)}」(으)로 옮겼습니다 — Ctrl+Z 되돌리기`); }
  return true;
}
function dndMoveCue(cueId, itemId) {
  const at = dndFindCue(state.show, cueId), dst = dndFindItem(state.show, itemId);
  if (!at || !dst || at.item.id === itemId) return false;
  const labels = labelMap(state.show), fromScene = at.scene.id;
  const r = relocateCue(state.show, cueId, itemId, null);
  if (!r || !r.changed) return false;
  renumberLabels(state.show);
  dndPush({ kind: 'cue', id: cueId, from: r.from, to: r.to, labels, scenes: Array.from(new Set([fromScene, dst.scene.id])) });
  // 편집기에 커서가 남아 있으면 Ctrl+Z 가 그 씬의 글 되돌리기로 가므로 놓고 나면 편집기에서 빠진다
  const a = document.activeElement; if (a && a.classList && a.classList.contains('doc')) a.blur();
  dndRedraw([fromScene, dst.scene.id], false, null);
  const ne = IDX.byItem.get(itemId);
  toast(`큐를 옮겼습니다 → ${ne && ne.q ? 'Q' + ne.q + ' · ' : ''}${cut(ne ? itemRefText(ne, 24) : '', 30)} — Ctrl+Z 되돌리기`);
  return true;
}
// e 를 되돌리거나(redo=false) 다시 실행(redo=true)
function dndApply(e, redo) {
  const S = state.show, dst = redo ? e.to : e.from;
  let sids;
  if (e.kind === 'item') {
    const cur = dndFindItem(S, e.id); if (!cur || !dndScene(S, dst.sceneId)) return false;
    sids = [cur.scene.id, dst.sceneId];
    dndSync(sids);
    if (!relocateItem(S, e.id, dst.sceneId, dst.index)) return false;
  } else {
    const cur = dndFindCue(S, e.id), di = dndFindItem(S, dst.itemId); if (!cur || !di) return false;
    sids = [cur.scene.id, di.scene.id];
    if (!relocateCue(S, e.id, dst.itemId, dst.index)) return false;
  }
  if (redo) renumberLabels(S); else restoreLabels(S, e.labels);
  e.scenes = Array.from(new Set(e.scenes.concat(sids)));
  dndRedraw(sids, e.kind === 'item', e.kind === 'item' ? e.id : null);
  return true;
}
// 되돌리기 한 단계. sid 가 있으면(편집기 안) 그 씬을 건드린 이동만 본다
function dndUndoStep(sid) {
  const m = mvBox();
  let j = -1; for (let k = m.undo.length - 1; k >= 0; k--) if (!sid || m.undo[k].scenes.includes(sid)) { j = k; break; }
  if (j < 0) return false;
  const e = m.undo[j];
  // 같은 문단·큐를 더 나중에 옮긴 기록이 있으면 맨 위부터 그것까지 차례로 (자리가 꼬이지 않게)
  const list = m.undo.slice(j + 1).some(x => x.id === e.id) ? m.undo.splice(j).reverse() : m.undo.splice(j, 1);
  let n = 0;
  list.forEach(x => {
    const ok = dndApply(x, false);
    // 이 이동 뒤에 그 씬들에서 찍힌 편집기 스냅숏은 이동이 반영된 모양이라 이제 맞지 않는다 — 버린다
    x.scenes.forEach(s => { const u = UNDO.get(s); if (u) { u.stack = u.stack.filter(y => (y.seq || 0) < x.seq); u.redo = []; u.t = 0; } });
    if (ok) { n++; x.rseq = ++UNDO_SEQ; m.redo.push(x); }
  });
  toast(n ? (n > 1 ? `옮기기 ${n}개를 되돌렸습니다` : '옮기기를 되돌렸습니다') : '옮긴 문단·큐를 찾지 못해 되돌리지 못했습니다');
  return true;
}
function dndRedoStep(sid) {
  const m = mvBox();
  let j = -1; for (let k = m.redo.length - 1; k >= 0; k--) if (!sid || m.redo[k].scenes.includes(sid)) { j = k; break; }
  if (j < 0) return false;
  const e = m.redo[j];
  // 되돌린 뒤 그 씬에서 글을 고쳤으면 다시 실행하지 않는다 (보통의 "다시 실행" 규칙과 같다)
  if (e.scenes.some(s => { const u = UNDO.get(s); return u && u.stack.some(y => (y.seq || 0) > e.rseq); })) { m.redo = []; return false; }
  m.redo.splice(j, 1);
  if (!dndApply(e, true)) { toast('옮긴 문단·큐를 찾지 못해 다시 실행하지 못했습니다'); return true; }
  e.seq = ++UNDO_SEQ; m.undo.push(e);
  e.scenes.forEach(s => { const u = UNDO.get(s); if (u) { u.redo = []; u.t = 0; } });
  toast('옮기기를 다시 실행했습니다');
  return true;
}
// 편집기 undo() 가 먼저 묻는다: 이 씬에서 가장 최근 일이 끌어 옮기기면 그것을 되돌리고 true
function dndUndoTurn(doc, redo) {
  const m = mvBox(), sid = doc.dataset.scene, list = redo ? m.redo : m.undo;
  let e = null; for (let k = list.length - 1; k >= 0; k--) if (list[k].scenes.includes(sid)) { e = list[k]; break; }
  if (!e) return false;
  const u = undoBox(doc), top = (redo ? u.redo : u.stack).slice(-1)[0];
  if (top && (top.seq || 0) > (redo ? e.rseq : e.seq)) return false;
  return redo ? dndRedoStep(sid) : dndUndoStep(sid);
}
// 편집기 밖(손잡이·빈 곳)의 Ctrl+Z / Ctrl+Y · Ctrl+Shift+Z — 끌어 옮긴 기록만
document.addEventListener('keydown', ev => {
  const mod = ev.ctrlKey || ev.metaKey, k = ev.key;
  if (!mod || ev.altKey || !(k === 'z' || k === 'Z' || k === 'y' || k === 'Y')) return;
  if (!state.show || state.view !== 'script' || state.modal || GATE.type) return;
  const t = ev.target;
  if (t && t.closest && (t.closest('.doc, .ce, .modal, #panel') || t.matches('input, textarea, select, [contenteditable="true"]'))) return;
  const redo = k === 'y' || k === 'Y' || ev.shiftKey, m = mvBox();
  if (!(redo ? m.redo : m.undo).length) return;
  ev.preventDefault();
  if (!(redo ? dndRedoStep(null) : dndUndoStep(null))) toast(redo ? '다시 실행할 것이 없습니다' : '되돌릴 것이 없습니다');
});

/* ================= 시작 ================= */
// http(s) 로 열렸으면 서버를 먼저 찾는다. 없으면(아티팩트·file://·정적 호스팅) 지금까지처럼 로컬 모드
loadPrefs();
if (/^https?:$/.test(location.protocol)) {
  showGate('loading');
  detectServer().then(h => { if (h) serverBoot(h).catch(bootFail); else localBoot(); });
} else localBoot();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (mountedView === 'script') queuePaint(); });
})();
</script>
