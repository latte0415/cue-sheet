<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- ARTIFACT:START -->
<title>공연 큐시트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* 흰 바탕 + 중립 회색(zinc) + 포인트 컬러 하나(--accent). 빨강(--red)은 미정·미해결·삭제에만 */
:root{
  --paper:#ffffff; --tint:#f4f4f5; --tint-2:#fafafa;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#71717a;
  --rule:#e4e4e7; --rule-2:#d4d4d8;
  --accent:#2563eb; --accent-tint:#eef3fe; --on-accent:#ffffff;
  --red:#dc2626;
  /* 부서 글자색: 대본 큐 블록의 부서 열. 색만으로 구분하지 않고 부서 이름을 항상 같이 쓴다 */
  --q-cast:#7a4bc2; --q-light:#a85d0b; --q-sound:#0d7a6f; --q-stage:#57606d;
  --overlay:rgba(9,9,11,.28);
  --sans:Pretendard,"Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,Pretendard,"Pretendard Variable","Noto Sans KR",monospace;
  --gut:76px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b0b0c; --tint:#18181b; --tint-2:#111113;
    --ink:#ececef; --ink-2:#a1a1aa; --ink-3:#85858e;
    --rule:#232327; --rule-2:#38383e;
    --accent:#5b9bff; --accent-tint:#13203a; --on-accent:#0b0b0c;
    --red:#f87171;
    --q-cast:#b49cf0; --q-light:#e0a45a; --q-sound:#52c2b4; --q-stage:#9ea7b3;
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0b0b0c; --tint:#18181b; --tint-2:#111113;
  --ink:#ececef; --ink-2:#a1a1aa; --ink-3:#85858e;
  --rule:#232327; --rule-2:#38383e;
  --accent:#5b9bff; --accent-tint:#13203a; --on-accent:#0b0b0c;
  --red:#f87171;
  --q-cast:#b49cf0; --q-light:#e0a45a; --q-sound:#52c2b4; --q-stage:#9ea7b3;
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
/* 부스 모드: 다크 고정 + 순흑 배경 + 대비를 한 단계 낮춤 (암전 중 부스 화면 밝기) */
:root.booth[data-theme="dark"]{
  --paper:#000000; --tint:#0d0d0f; --tint-2:#070708;
  --ink:#c4c4ca; --ink-2:#8b8b93; --ink-3:#6a6a72;
  --rule:#18181b; --rule-2:#2a2a2f;
  --accent:#4f86e0; --accent-tint:#0c1628; --on-accent:#000000;
  --red:#d55c5c;
  --q-cast:#9282c2; --q-light:#b98a4f; --q-sound:#449c91; --q-stage:#7f8792;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;letter-spacing:-.005em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.txt{font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule-2);padding:5px 8px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
textarea{resize:vertical}
input[type=checkbox]{accent-color:var(--accent);margin:0 5px 0 0;vertical-align:-2px}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:none}
input[type=color]{padding:0 2px;width:40px;height:30px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-tint)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.red{color:var(--red)}
.muted{color:var(--ink-3)}
.sm{font-size:12px}

/* 버튼: 1px 테두리 사각 또는 텍스트 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--paper);padding:4px 11px;font-size:13px;font-weight:500;line-height:1.45;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:var(--tint-2)}
.btn.strong{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.strong:hover{border-color:var(--accent);background:var(--accent);opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.tb{font-size:13px;color:var(--ink-2);white-space:nowrap;border-bottom:1px solid transparent;line-height:1.4}
.tb:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default;border-bottom-color:transparent;color:var(--ink-2)}
.tb.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tb.red,.btn.red{color:var(--red)}
.tb.red:hover{border-bottom-color:var(--red)}
.armed{color:var(--red)!important;border-color:var(--red)!important;font-weight:500}
.lbl{font-size:12px;color:var(--ink-3)}
.dl{font-size:12px;color:var(--ink-3);white-space:nowrap}
.empty{color:var(--ink-3);font-size:13px;padding:10px 0;margin:0}
.chk{display:inline-flex;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap}

/* ---------- 골격 ---------- */
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 24px;border-bottom:1px solid var(--rule);padding-top:10px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1 1 180px;padding-bottom:9px}
.show-title{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{font-size:14px;color:var(--ink-3);padding:4px 0 8px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tools-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-left:auto;padding-bottom:8px}
.role-sel{border:0;border-bottom:1px solid var(--rule-2);padding:1px 2px;background:transparent;font-size:13px;max-width:150px}
.mode{display:inline-flex;gap:8px;align-items:baseline;font-size:13px}
.mode .sep{color:var(--rule-2)}
.count{color:var(--red);font-family:var(--mono);font-weight:500;font-size:12px;margin-left:4px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--rule-2);min-width:200px;z-index:30}
.menu button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--rule)}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:var(--tint)}
.nav-toggle{display:none}
.body{flex:1;min-height:0;display:flex}
.nav{width:210px;flex:none;overflow:auto;border-right:1px solid var(--rule);padding:12px 14px 40px 0}
.main{flex:1;min-width:0;overflow:auto;padding:0 0 90px 28px;scroll-padding-top:8px}
.panel{width:340px;flex:none;overflow:auto;border-left:1px solid var(--rule);padding:12px 0 30px 16px}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:35}

/* ---------- 내비 ---------- */
.nav ol{list-style:none;margin:0;padding:0}
.nav-check{display:block;font-size:12px;color:var(--ink-3);padding:0 0 8px}
.nav-check:hover{color:var(--accent)}
.nav-pre{font-size:12px;color:var(--ink-3);padding:2px 0 8px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.nav-part{font-size:12px;font-weight:500;color:var(--ink-3);padding:16px 0 6px}
.nav-sp{font-weight:400;font-variant-numeric:tabular-nums}
.nav-sum{font-size:12px;color:var(--ink-3);border-top:1px solid var(--rule);margin-top:14px;padding-top:8px}
/* 씬: 1줄 제목 · 시작 시각 / 2줄 출연자 · 미정 큐 · 길이 (2줄은 회색 작은 글씨) */
.nav-scene{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:baseline;width:100%;text-align:left;padding:5px 0 5px 10px;font-size:13px;line-height:1.4;color:var(--ink);box-shadow:inset 2px 0 0 transparent}
.nav-scene:hover{background:var(--tint-2)}
.nav-scene.cur{font-weight:500;background:var(--tint);box-shadow:inset 2px 0 0 var(--accent)}
.nav-t,.nav-c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-at{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink-2);font-weight:400;text-align:right;white-space:nowrap}
.nav-at.approx{color:var(--ink-3)}
.nav-c,.nav-d{font-size:11px;color:var(--ink-3);font-weight:400}
.nav-d{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.nav-d b{color:var(--red);font-weight:400;font-size:10px;margin-right:6px}
/* 출연자 역할: 내가 나오는 씬 제목은 accent, 나머지는 흐리게 */
.nav-scene.me .nav-t{color:var(--accent)}
.nav-scene.not-me .nav-t{color:var(--ink-3)}
/* 진행: 액트 사이를 잇는 작은 연결 줄 — 들여쓰기 + 짧은 세로 점선 */
.nav-scene.mc{position:relative;padding:2px 0 2px 26px;font-size:12px;color:var(--ink-3);box-shadow:none}
.nav-scene.mc::before{content:"";position:absolute;left:15px;top:0;bottom:0;border-left:1px dashed var(--rule-2)}
.nav-scene.mc:hover{color:var(--ink);background:none}
.nav-scene.mc.cur{color:var(--accent);background:none;font-weight:400}
.nav-scene.mc.cur::before{border-left:1px solid var(--accent)}

/* ---------- 대본 (문서 편집기) ---------- */
.script{max-width:780px;padding:4px 0 0 var(--gut)}
.preshow{font-size:13px;color:var(--ink-2);padding:14px 0 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ce{outline:0;min-width:2em}
.ce:empty::before{content:attr(data-ph);color:var(--ink-3)}
.ro .ce:empty::before{content:""}
.part-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;border-bottom:1px solid var(--ink);padding:30px 0 6px}
.pt-no{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.pt-name{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.hov{display:inline-flex;flex-wrap:wrap;gap:4px 12px;opacity:0;transition:opacity .12s}
.part-h:hover .hov,.part-h:focus-within .hov,.sc-head:hover .hov,.sc-head:focus-within .hov,.hov.keep{opacity:1}
@media (hover:none){.hov{opacity:1}}
.rest{display:contents}
.scene{padding:26px 0 6px;scroll-margin-top:8px}
.sc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;border-bottom:1px solid var(--rule-2);padding-bottom:5px}
.sc-title{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.sc-meta{font-size:12px;color:var(--ink-3)}
/* 진행 씬: 큰 제목 대신 얇은 괘선 + 작은 회색 이름 */
.scene.mc{padding-top:16px}
.scene.mc .sc-head{border-bottom:1px dashed var(--rule-2);padding-bottom:3px}
.scene.mc .sc-title{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.01em}
.ro .scene.mc .sc-title:empty::before{content:attr(data-ph)}
.sc-setup{font-size:12px;color:var(--ink-3);padding-top:3px}
.sc-props{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 0;border-bottom:1px dashed var(--rule-2);font-size:13px}
.sc-props label{display:inline-flex;align-items:center;gap:6px}
.sc-props .grow{flex:1 1 220px}
.sc-props .grow input{flex:1}
.in-num{width:58px}
.sc-props input[type=text],.sc-props input[type=number]{border:0;border-bottom:1px solid var(--rule-2);background:transparent;padding:2px 0}
.sc-props input:focus{border-bottom-color:var(--accent)}
.cast-edit{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.sheet{position:relative;margin-top:12px}
.gutter{position:absolute;left:calc(-1 * var(--gut));top:0;width:calc(var(--gut) - 10px)}
.g{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:flex-end;border-right:2px solid transparent;padding-right:7px}
.g.has-q{border-right-color:var(--accent)}
.g.tbd{border-right-style:dashed}
.g.other{opacity:.35}
.g-open{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono);font-size:11px;line-height:1.3;color:var(--ink-3);padding-top:6px;text-align:right;width:100%;white-space:nowrap}
.g.has-q .gq{color:var(--accent);font-weight:500}
.g .gc.open{color:var(--red)}
.g.sel .g-open{text-decoration:underline}
.g:hover,.g:focus-within{z-index:2}
.g-del{font-size:11px;color:var(--red);border-bottom:1px solid var(--red);margin-top:2px;white-space:nowrap;background:var(--paper)}
.doc{outline:0;font-family:var(--sans);font-size:16px;line-height:1.7;caret-color:var(--accent);min-height:1.7em}
.doc p{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere;position:relative;padding:2px 4px 2px 10px} /* 왼쪽 10px = 큐 줄의 부서 괘선(2px)+들여쓰기(8px)와 글자 줄 맞춤 */
.doc p.k-action{color:var(--ink-2)}
.doc .spk{font-weight:600;font-size:14px;letter-spacing:0}
.doc .paren{color:var(--ink-3)}
.doc p.sel{background:var(--tint)}
.ro .doc p.sel{background:none}
.doc p.dim{color:var(--ink-3)}
.ro{--gut:52px}
.ro .g-open{font-size:10px;padding-top:7px}
.doc[data-empty]::before{content:attr(data-empty);position:absolute;left:10px;top:2px;color:var(--ink-3);pointer-events:none}
.ro .g{padding-right:5px}
/* 큐 블록: 큐가 달린 문단 위에 한 큐 한 줄 — [부서 열] 내용(진하게) 미정 시점 · 메모(작게 회색). 그 아래 문단 본문은 보통 굵기 */
.qlayer{position:absolute;left:0;right:0;top:0;height:0;z-index:1}
.qb{position:absolute;left:0;right:4px;display:block;padding:2px 0 2px;text-align:left}
.doc p.has-qb{padding-top:calc(var(--qh, 0px) + 1px);margin-top:10px}
/* 큐 숨기기: 큐 줄과 그 자리(--qh 여백)를 빼고 대사만 — 거터의 Q 번호는 남긴다 */
.hide-cues .qlayer{display:none}
.hide-cues .doc p.has-qb{padding-top:2px;margin-top:0}
.ql{display:grid;grid-template-columns:2.4em minmax(0,1fr);column-gap:10px;align-items:baseline;font-size:14px;line-height:1.5;color:var(--ink)}
.ql .qd{font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.ql.d-cast .qd{color:var(--q-cast)}
.ql.d-light .qd{color:var(--q-light)}
.ql.d-sound .qd{color:var(--q-sound)}
.ql.d-stage .qd{color:var(--q-stage)}
.ql .qx{min-width:0;overflow-wrap:anywhere}
.ql .qt{font-weight:600}
.ql .qs{font-size:12px;font-weight:600;color:var(--red);margin-left:8px;white-space:nowrap}
.ql .qt.tbd,.qt.miss{color:var(--red)}
/* 머리글(.qt) 굵게 · 값(.qv) 보통 · 상세(.qdt) 약하게 · 시점·메모(.qm) 더 약하게 — 대본 큐 줄 · 패널 · 큐시트 · 런 · 무대 상황 공통 */
.qt{font-weight:600}
.qv{font-weight:400;color:var(--ink);margin-left:8px}
.qdt{font-size:.93em;color:var(--ink-2);margin-left:8px}
.ql .qm{font-size:12px;color:var(--ink-3);margin-left:8px}
/* 큐가 달린 지문 = 굵은 큐 머리글 아래에 붙는 보충 디테일 → 흐리게. 큐가 없는 지문·대사는 보통, 큐를 숨기면 보통 */
.doc p.k-action.has-qb{color:var(--ink-3);font-size:.875em}
.hide-cues .doc p.k-action.has-qb{color:var(--ink-2);font-size:inherit}
/* 큐 지점(kind:'cue'): 본문 줄 없이 큐 블록만 — 표지 높이 = 큐 블록. 큐를 숨기면 얇은 점선 한 줄 */
.doc p.qpt{padding-bottom:0;min-height:0;user-select:none;cursor:default}
.hide-cues .doc p.qpt{padding-top:0;height:0;margin:3px 0;border-top:1px dashed var(--rule-2)}
.ql .qn{font-family:var(--mono);font-size:11px;color:var(--accent);white-space:nowrap}
.ql.other .qt{font-weight:400;color:var(--ink-3)}
.ql.other .qd{color:var(--ink-3);font-weight:400}
/* 대본 큐 줄의 부서 구분: 줄마다 왼쪽 2px 부서색 괘선 (거터의 파란 선과 떨어진 본문 안쪽), 글자는 8px 들여 씀 — 본문 문단도 같은 폭만큼 들인다 */
.qb .ql{border-left:2px solid var(--dc, var(--rule-2));padding-left:8px}
.qb .ql.d-cast{--dc:var(--q-cast)}.qb .ql.d-light{--dc:var(--q-light)}.qb .ql.d-sound{--dc:var(--q-sound)}.qb .ql.d-stage{--dc:var(--q-stage)}
.qb .ql.other{--dc:var(--rule-2)}
.qb .ql+.ql{margin-top:1px}
.qb:hover .qt{text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
/* 끌어 옮기기 (편집 모드): 문단 손잡이는 본문 바로 왼쪽의 점선 두 줄, 놓을 곳은 문단 사이 가로 괘선 하나, 큐를 놓을 문단은 옅은 바탕 + 왼쪽 선 */
.dnd-h{position:absolute;left:-14px;z-index:3;width:14px;height:27px;display:flex;align-items:center;justify-content:center;color:var(--rule-2);cursor:grab;touch-action:none}
.dnd-h::before{content:"";width:2px;height:13px;border-left:2px dotted currentColor;border-right:2px dotted currentColor}
.dnd-h:hover,.dnd-h:focus{color:var(--accent);outline:0}
.dnd-h:focus-visible{box-shadow:inset 0 -1px 0 var(--accent)}
.ro .dnd-h{display:none}
@media (pointer:coarse){.dnd-h{left:-20px;width:20px;color:var(--ink-3)}}
.dnd-line{position:fixed;z-index:60;height:0;border-top:2px solid var(--accent);pointer-events:none}
.dnd-tag{position:fixed;z-index:61;max-width:280px;padding:0 6px;font-size:12px;line-height:1.6;color:var(--ink);background:var(--paper);border-left:2px solid var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.app.dnd-drag,.app.dnd-drag *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.doc p.dnd-src,.ql.dnd-src,.qb.dnd-src,.g.dnd-src{opacity:.35}
/* Q 묶음: 거터의 Q 번호를 끈다 — 터치는 이 버튼에서만 스크롤 대신 끌기 (거터 빈 곳·본문은 그대로 스크롤) */
.script:not(.ro) .g.has-q .g-open{cursor:grab;touch-action:none}
.doc p.dnd-tgt{background:var(--accent-tint);box-shadow:inset 2px 0 0 var(--accent)}
.script:not(.ro) .qb .ql[data-cue]{cursor:grab}
.script:not(.ro) .qb .ql .qd{touch-action:none}
/* 문단 사이 "+ 큐" (편집 모드 호버): 얇은 괘선 + 오른쪽 끝 글자 버튼. 괘선은 클릭을 막지 않는다 */
.gap-add{position:absolute;z-index:3;height:0;pointer-events:none}
.gap-add .gap-l{position:absolute;left:10px;right:44px;top:0;border-top:1px solid var(--accent)}
.gap-add .gap-b{position:absolute;right:0;top:-9px;height:18px;padding:0 0 0 6px;font-size:11px;line-height:18px;color:var(--accent);background:var(--paper);pointer-events:auto;white-space:nowrap}
.gap-add .gap-b:hover{text-decoration:underline;text-underline-offset:3px}
.dnd-tag.newpt::before{content:"새 큐 지점 · ";color:var(--accent)}
@media print{.dnd-h,.dnd-line,.dnd-tag,.gap-add{display:none!important}}

/* ---------- 큐시트 ---------- */
.cs-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:18px 0 10px}
.cs-top h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.note{font-size:12px;color:var(--ink-3);margin:0}
.table-wrap{overflow-x:auto;max-width:100%}
/* 고정 레이아웃: 열 너비는 <colgroup> 이 정한다(이 기기 prefs csColW). 표 width·min-width 는 viewCuesheet·csApplyW 가 인라인으로 */
.cs-table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px}
.cs-table th,.cs-table td{padding:8px 10px 9px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;background:var(--rb,transparent)}
.cs-table td:not(.cs-num){overflow:hidden;overflow-wrap:anywhere}
.cs-table thead th{position:relative;font-size:12px;font-weight:400;color:var(--ink-3);border-bottom:1px solid var(--rule-2);white-space:nowrap}
.cs-table thead th.col-mine,.cs-table thead th.col-mine .dl{color:var(--ink);font-weight:500}
.cs-table .th-l{display:block;overflow:hidden;text-overflow:ellipsis}
/* 행 호버·선택은 바탕을 바꾸지 않고 --rb 만 정한다 — 부서 바탕(wash)이 그 위에 섞인다 */
.cs-table tbody tr.row{cursor:pointer}
.cs-table tbody tr.row:hover{--rb:var(--tint-2)}
.cs-table tbody tr.sel{--rb:var(--tint)}
.cs-num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);font-weight:500;border-left:2px solid transparent}
tr.tbd .cs-num{border-left:2px dashed var(--red)}
.cs-ctx{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cs-trig{font-size:12px;color:var(--ink-3);margin:1px 0}
.cs-text{font-size:14px;line-height:1.6;white-space:pre-wrap}
.cs-text .spk{font-weight:600;font-size:13px;margin-right:5px}
.cs-text.k-action{color:var(--ink-2)}
.cs-text .paren{color:var(--ink-3)}
.cs-c{font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;margin-bottom:4px;overflow-wrap:anywhere}
.cs-c:last-child{margin-bottom:0}
.cs-ct{display:block;font-size:12px;color:var(--ink-3)}
.cs-c .qv,.cs-c .qdt{display:block;margin-left:0;font-size:12px}
.cs-c .qv{color:var(--ink-2)}
.cs-c .qdt{color:var(--ink-3)}
.rc-sum .qt{font-weight:600}
.rc-sum .qv,.rc-sum .qdt{font-size:.8em}
.cs-cont{font-size:12px;color:var(--ink-3)}
/* 부서 열(.dcol): 머리글 아래 2px 부서색(고른 부서 3px) · 큐 한 덩어리마다 왼쪽 2px 부서색 + 8px (대본 큐 줄과 같은 말) */
.cs-table .d-cast{--dc:var(--q-cast)}.cs-table .d-light{--dc:var(--q-light)}.cs-table .d-sound{--dc:var(--q-sound)}.cs-table .d-stage{--dc:var(--q-stage)}
.cs-table thead th.dcol{border-bottom:2px solid var(--dc)}
.cs-table thead th.dcol.col-mine{border-bottom-width:3px;padding-bottom:8px}
.cs-table .dcol .cs-c{border-left:2px solid var(--dc,var(--rule-2));padding-left:8px}
.cs-table td.col-dim .cs-c{--dc:var(--rule-2)}
.cs-table .dcol .cs-cont{padding-left:10px}
/* 부서 바탕: 부서색을 종이색에 아주 옅게 섞는다(불투명). 고른 부서 열만 한 단계 진하게. 씬 경계 행·번호·큐·메모 열은 바탕 없음 */
:root{--w-base:4%;--w-on:8%}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--w-base:6%;--w-on:12%} }
:root[data-theme="dark"]{--w-base:6%;--w-on:12%}
:root.booth[data-theme="dark"]{--w-base:4%;--w-on:8%}
.cs-table .dcol{--cs-w:var(--w-base);background:color-mix(in srgb,var(--dc) var(--cs-w),var(--rb,var(--paper)))}
.cs-table .dcol.col-mine{--cs-w:var(--w-on)}
/* 바탕 위 작은 글자는 --ink-2 (라이트 8% 바탕에서 --ink-3 은 4.5:1 에 못 미침) */
.cs-table .dcol .qdt,.cs-table .dcol .cs-ct,.cs-table .dcol .cs-cont,.cs-table .dcol .play.nofile{color:var(--ink-2)}
/* 흐림: 칸 전체 opacity 대신 내용에만 — 부서 바탕·괘선은 그대로 */
.cs-table th.col-dim>:not(.rz),.cs-table td.col-dim>*{opacity:.35}
.cs-table tr.col-dim>td:not(.dcol),.cs-table tr.col-dim>td.dcol>*{opacity:.35}
.cs-table thead th.dcol.col-dim{border-bottom-color:color-mix(in srgb,var(--dc) 35%,var(--paper))}
/* 내 큐가 있는 행: 표 왼쪽 여백(10px)에 2px 역할색 — 번호 칸의 빨간 점선(미정)과 자리를 나눈다 */
.cs-wrap{padding-left:10px}
.cs-table tr.mine td.cs-num{position:relative}
.cs-table tr.mine td.cs-num::before{content:"";position:absolute;left:-10px;top:-1px;bottom:-1px;border-left:2px solid var(--mc,var(--accent))}
/* 열 너비 조절: 머리글 경계 위 8px 잡는 자리. 호버·포커스·끄는 중에만 1px 선 */
.rz{position:absolute;top:0;bottom:-1px;right:-4px;width:8px;z-index:2;cursor:col-resize;touch-action:none}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:4px;border-left:1px solid transparent}
.rz:hover::after,.rz:focus-visible::after,.rz.drag::after{border-left-color:var(--accent)}
.rz:focus-visible{outline:0}
.cs-table thead th:last-child .rz,.cs-table thead th:has(+th.strip) .rz{right:0}
.cs-table thead th:last-child .rz::after,.cs-table thead th:has(+th.strip) .rz::after{left:7px}
body.rz-on,body.rz-on *{cursor:col-resize!important;user-select:none!important;-webkit-user-select:none!important}
/* 접기: 머리글 오른쪽 끝 − · 접힌 열은 28px 띠(+ · 세로 부서 이름), 칸에는 큐마다 2×12px 눈금(미정은 빨강) */
.cs-table .dh-in{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.cs-table .dh-in .dl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cs-table .fold{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding:0 2px;border-bottom:1px solid transparent;line-height:1.2;flex:none}
.cs-table .fold:hover{color:var(--accent);border-bottom-color:var(--accent)}
.cs-table th.strip,.cs-table td.strip{padding:8px 0 9px;text-align:center}
.cs-table th.strip{cursor:pointer;z-index:3}
.strip-h{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;color:var(--ink-3);font-size:12px;line-height:1.1}
.strip-h .vt{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.08em}
.cs-table th.strip:hover .strip-h,.cs-table th.strip:hover .fold{color:var(--accent)}
.cs-table .tks{display:block}
.cs-table .tk{display:block;width:2px;height:12px;margin:4px auto 0;background:var(--dc)}
.cs-table .tk.tbd{background:var(--red)}
.cs-table .pr-only{display:none}
.cs-memo{font-size:12px;color:var(--ink-2)}
.cs-memo div+div{margin-top:3px}
.cs-scene th{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding-top:14px;font-weight:400;scroll-margin-top:8px}
.cs-scene b{font-size:15px;font-weight:600;margin-right:10px}
.cs-scene .sc-meta{margin-right:12px}
/* 진행 구분 행: 얇게 */
.cs-scene.mc th{border-top:1px solid var(--rule-2);padding-top:5px;padding-bottom:5px}
.cs-scene.mc b{font-size:12px;font-weight:500;color:var(--ink-3);margin-right:8px}
.cs-pre td{font-size:12px;color:var(--ink-2)}
.cs-none td{color:var(--ink-3);font-size:12px}
.play{font-size:12px;color:var(--accent);border-bottom:1px solid var(--accent);margin-right:6px;white-space:nowrap}
.play:hover{opacity:.8}
.play.nofile{color:var(--ink-3);border-bottom:1px dashed var(--rule-2)}

/* ---------- 런 ---------- */
.run{max-width:860px;margin:0 auto;padding:18px 0}
.run-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.run-pos{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--accent);line-height:1.1}
.run-of{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.run-where{font-size:13px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.run-mine{margin-left:auto}
.run-mine.disabled{opacity:.45;cursor:default}
.run-prog{height:1px;background:var(--rule);margin:10px 0 0}
.run-prog i{display:block;height:2px;margin-top:-.5px;background:var(--accent)}
.run-ctx{font-size:14px;color:var(--ink-3);padding:10px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.run-ctx .spk{font-weight:600;font-size:13px;margin-right:5px}
.run-cur{border-top:2px solid var(--accent);border-bottom:1px solid var(--rule-2);padding:14px 0 6px}
.run-trig{font-size:13px;color:var(--ink-2)}
.run-text{font-size:clamp(20px,3.2vw,28px);font-weight:500;letter-spacing:-.015em;line-height:1.5;margin:6px 0 12px;overflow-wrap:anywhere;white-space:pre-wrap}
.run-text.k-action{color:var(--ink-2)}
.run-text .spk{font-weight:600;font-size:.62em;letter-spacing:0;margin-right:8px;color:var(--ink-2)}
.run-cues{border-collapse:collapse;width:100%}
.run-cues th,.run-cues td{border-top:1px solid var(--rule);padding:10px 10px 10px 0;text-align:left;vertical-align:top}
.run-cues th{width:56px;font-weight:400}
.rc-sum{font-size:18px;font-weight:500;line-height:1.4;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rc-trig{font-size:12px;color:var(--ink-3)}
.rc-memo{font-size:12px;color:var(--ink-2)}
.rc-a{text-align:right!important;white-space:nowrap}
.rc-a .btn{margin:0 0 4px 6px}
.run-cues tr.other .rc-sum{font-size:13px;color:var(--ink-3)}
.run-cues tr.other{opacity:.6}
.run-next{padding:12px 0;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.run-next b{font-weight:600}
.run-next .rn-c{font-size:12px;color:var(--ink-3)}
.run-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.run-btns .btn{justify-content:center;min-height:56px;font-size:16px}
.run-foot{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:12px 0 0}
.run-hint{font-size:12px;color:var(--ink-3);margin:0;flex:1;min-width:0;text-align:right}
.run-opts{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font-size:12px;padding-top:6px}
.run-chk{font-size:12px;color:var(--red);border-bottom:1px solid var(--red)}
/* 공연 모드 한 줄: 켜짐 = 포인트 색 글자, 꺼짐 = 회색, 받아야 할 곡이 남으면 빨강(.red) */
.run-sm{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:12px;padding:6px 0 4px;color:var(--ink-2);min-width:0}
.run-sm .sm-k{font-weight:600;color:var(--ink)}
.run-sm.on .sm-k{color:var(--accent)}
.run-sm.off .sm-k{font-weight:500;color:var(--ink-3)}
.run-sm .sep{color:var(--rule-2)}
.run-sm .tb{font-size:12px}
.run-sm .note{flex:1 1 200px;min-width:0}
.run-sm .sm-err{flex:1 1 100%;overflow-wrap:anywhere}
#swbar{border-bottom-color:var(--rule-2);color:var(--ink)}
@media (hover:none) and (pointer:coarse){.run-keys{display:none}}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-2);padding:0 4px;color:var(--ink-2)}
.cd{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.cd-n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:min(46vmin,340px);line-height:1;font-weight:500}
.cd-l{font-size:15px;color:var(--ink-2);text-align:center;max-width:640px;overflow-wrap:anywhere}
.cd.zero .cd-n{color:var(--accent)}
.cd.flash::after{content:"";position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none;animation:cdflash .8s ease-out 1}
@keyframes cdflash{0%{opacity:0}20%{opacity:.85}100%{opacity:0}}
/* 부스 모드: 전면 플래시 대신 숫자만 한 번 깜박 */
.cd.flash-num .cd-n{animation:cdblink .7s steps(1,end) 1}
@keyframes cdblink{0%{opacity:1}35%{opacity:.12}70%{opacity:1}}

/* ---------- 사람 / 음원 ---------- */
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:20px 0 8px;border-bottom:1px solid var(--rule-2)}
.sec-h h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.ltable{border-collapse:collapse;width:100%;font-size:13px}
.ltable th,.ltable td{padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.ltable thead th{font-size:12px;font-weight:400;color:var(--ink-3);white-space:nowrap}
.ltable .n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:16px}
.ltable tr.mine td{background:var(--tint)}
.ltable input[type=text],.ltable input[type=number],.ltable select{border:0;border-bottom:1px solid var(--rule-2);background:transparent;padding:3px 0}
.ltable input:focus,.ltable select:focus{border-bottom-color:var(--accent)}
.pp-table{min-width:760px}
.pp-name{font-size:14px;font-weight:600}
.pp-scenes button{font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--rule-2);margin-right:8px}
.pp-scenes button:hover{color:var(--accent);border-bottom-color:var(--accent)}
.matrix{min-width:520px}
.matrix td{text-align:center;font-family:var(--mono);font-size:12px}
.matrix th.mine,.matrix td.mine{background:var(--tint)}
.tr-table{min-width:900px}
.tr-table tr.no-file td{color:var(--ink-3)}
.tr-table tr.playing td{background:var(--accent-tint)}
.tr-table input[type=text]{width:100%;min-width:110px}
.tr-file{max-width:220px;overflow-wrap:anywhere}
.tr-table label{position:relative;overflow:hidden}
.tr-uses td{padding-left:16px}
.ref-link{display:block;font-size:12px;color:var(--ink-2);text-align:left;padding:2px 0;overflow-wrap:anywhere}
.ref-link:hover{color:var(--accent);text-decoration:underline}
.dropzone{border:1px dashed var(--rule-2);padding:10px 12px;margin:12px 0}
.dropzone.over{border-color:var(--accent);background:var(--accent-tint)}
.err{color:var(--red);font-size:13px;margin:4px 0}

/* ---------- 점검 ---------- */
/* 막힘만 빨강(숫자·왼쪽 괘선), 확인·참고는 회색. 마지막으로 누른 항목은 accent 괘선 */
.ck-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:14px;color:var(--ink-2);padding:10px 0 0}
.ck-sum b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.ck-sum.has-block b{color:var(--red)}
.ck-sum.ok b{color:var(--accent)}
.ck-sum .sep,.ckbar .sep{color:var(--rule-2)}
.ck-sev{margin:0;padding:22px 0 6px;font-size:12px;font-weight:500;color:var(--ink-3);border-bottom:1px solid var(--rule-2)}
.ck-sev.block{color:var(--red)}
.ck-g{padding:12px 0 4px;border-bottom:1px solid var(--rule)}
.ck-g h4{margin:0 0 4px;font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.ck-g h4 .n{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink-3)}
.ck-g.block h4 .n{color:var(--red)}
.ck-note{font-size:12px;font-weight:400;color:var(--ink-3);min-width:0;overflow-wrap:anywhere}
.ck-fold{font:inherit;color:inherit}
.ck-fold::after{content:' ▸';color:var(--ink-3);font-weight:400}
.ck-fold[aria-expanded="true"]::after{content:' ▾'}
.ck-fold:hover{color:var(--accent)}
.ck-g ol{list-style:none;margin:0;padding:0}
.ck-g li{border-top:1px solid var(--rule)}
.ck-g li:first-child{border-top:0}
.ck-g .ref-link{font-size:13px;padding:6px 0 6px 10px;border-left:2px solid var(--rule-2);width:100%}
.ck-g.block .ref-link{border-left-color:var(--red)}
.ck-g li.ck-sub .ref-link{padding-left:24px}
.ck-g li.last .ref-link{border-left-color:var(--accent);color:var(--ink)}
.ck-none{margin:0;padding:12px 0 0;font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.count.soft{color:var(--ink-3)}
/* 점검에서 온 이동: 본문(또는 패널) 맨 위 한 줄 */
.ckbar{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:6px 0;font-size:13px;background:var(--paper);border-bottom:1px solid var(--rule-2)}
.ckbar .ck-pos{font-size:12px;color:var(--ink-3)}
.ckbar.in-panel{position:static;margin:0 0 6px}
.main:has(> .ckbar:not([hidden])){scroll-padding-top:44px}
@media print{.ckbar{display:none!important}}

/* ---------- 패널 ---------- */
.pn-h{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--rule-2)}
.pn-tabs{display:flex;gap:16px;flex:1}
.pn-tabs button{font-size:13px;color:var(--ink-3);padding:2px 0 7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.pn-tabs button:hover{color:var(--ink)}
.pn-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.pn-h .tb{margin-bottom:6px}
.pn-ref{padding:10px 0;border-bottom:1px solid var(--rule)}
.pn-ref .txt{font-size:15px;line-height:1.6;overflow-wrap:anywhere;margin-top:2px}
.pn-sec{padding:12px 0 6px}
.pn-sec h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--ink-3)}
.pn-sec h4.pn-h4{display:flex;align-items:baseline;gap:14px}
.pn-h4 .tb{font-size:12px}
.pn-h4 .tb:not(.on){font-weight:400}
.pn-cues,.cmts{list-style:none;margin:0 0 10px;padding:0}
.pn-cues li{border-top:1px solid var(--rule);padding:8px 0 8px 10px;border-left:2px solid var(--accent)}
.pn-cues li.tbd{border-left-style:dashed}
.pn-cues li.sel{background:var(--tint)}
.pc-top{display:flex;gap:10px;align-items:baseline}
.pc-sum{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.pc-sum .qt{font-weight:600}
.pc-det{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.pc-det .qv:first-child,.pc-det .qdt:first-child{margin-left:0}
.pc-trig{font-size:12px;color:var(--ink-3);margin-top:2px}
.pc-memo{font-size:12px;color:var(--ink-2);margin-top:2px}
.pc-a{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.cmts li{border-top:1px solid var(--rule);padding:8px 0 8px 10px;border-left:2px solid var(--red)}
.cmts li.resolved{border-left-color:var(--rule-2);color:var(--ink-2)}
.cmt-h{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.cmt-h time{color:var(--ink-3)}
.cmts p{margin:3px 0 5px;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.cmt-a{display:flex;gap:14px}
.cmt-form{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.cmt-form .row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.cmt-form .row input{flex:1}
.pn-del{border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}
.cmts li[data-act]{cursor:pointer}
.cmts li[data-act]:hover{background:var(--tint-2)}
/* 코멘트 위치 강조: 위아래 괘선 + 배경이 옅어진다 (표 행은 칸에) */
.cmt-hit,tr.cmt-hit>td,tr.cmt-hit>th{animation:cmt-hit 2.4s ease-out}
tr.cmt-hit{animation:none}
@keyframes cmt-hit{0%,50%{background:var(--accent-tint);box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}100%{background:transparent;box-shadow:inset 0 1px 0 transparent,inset 0 -1px 0 transparent}}
@media (prefers-reduced-motion: reduce){.cmt-hit:not(tr),tr.cmt-hit>td,tr.cmt-hit>th{background:var(--accent-tint);box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}}
.rv-c{margin:0;font-size:13px;border-left:2px solid var(--red);padding-left:10px;overflow-wrap:anywhere}
.rv-c time{color:var(--ink-3);font-size:12px}
.rv-ref{margin:0;font-size:12px;color:var(--ink-3)}
.rv-t{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rv-t th,.rv-t td{border-top:1px solid var(--rule);padding:6px 10px 6px 0;text-align:left;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}
.rv-t thead th{border-top:0;border-bottom:1px solid var(--rule-2);font-size:12px;font-weight:500;color:var(--ink-3)}
.rv-t thead th:first-child,.rv-t .rv-k{width:5.5em}
.rv-t .rv-k{font-size:12px;font-weight:400;color:var(--ink-3)}
.rv-t .rv-out{color:var(--ink-3);text-decoration:line-through}

/* ---------- 모달 / 토스트 / 플레이어 ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.modal{background:var(--paper);border:1px solid var(--rule-2);width:min(660px,100%);margin-block:auto;display:flex;flex-direction:column}
.modal-h{display:flex;align-items:baseline;gap:8px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.modal-h h2{margin:0;font-size:15px;font-weight:600;flex:1;min-width:0}
.modal-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid var(--rule);justify-content:flex-end;align-items:center}
.modal-f .left{margin-right:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:12px;color:var(--ink-2)}
.m-ref{font-size:13px;color:var(--ink-2);border-left:2px solid var(--rule-2);padding-left:10px;overflow-wrap:anywhere}
.m-tabs{display:flex;gap:18px;border-bottom:1px solid var(--rule)}
.m-tabs button{font-size:14px;color:var(--ink-3);padding:2px 0 7px;border-bottom:2px solid transparent;margin-bottom:-1px}
.m-tabs button:hover{color:var(--ink)}
.m-tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13px}
.ch-rows{border-top:1px solid var(--rule)}
.ch-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:end}
.ch-row .wide{grid-column:span 2}
/* 출연 사람 줄: 사람 · 액션 · 순서/삭제 — 좁으면 액션과 버튼이 아랫줄로 */
.cast-row{display:grid;grid-template-columns:minmax(140px,1fr) auto auto;gap:4px 16px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:end}
.cast-ops{display:flex;gap:4px 14px;align-items:center;padding:4px 0}
.cast-ops .tb{min-width:1.2em;text-align:center}
@media (max-width:520px){.cast-row{grid-template-columns:minmax(0,1fr) auto}.cast-row>.field:first-child{grid-column:1/-1}}
/* 큐 모달: 머리글 미리보기(읽기 전용) · 액션 버튼 묶음 · 채널 체크 · 새 소품 등록 */
.qprev{border-left:2px solid var(--dc,var(--rule-2));padding:4px 0 6px 10px;background:var(--tint-2)}
.qprev.d-cast{--dc:var(--q-cast)}.qprev.d-light{--dc:var(--q-light)}.qprev.d-sound{--dc:var(--q-sound)}.qprev.d-stage{--dc:var(--q-stage)}
.qprev-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 12px;padding-right:8px;font-size:12px;color:var(--ink-3)}
.qprev-l{margin-top:2px;overflow-wrap:anywhere}
.qprev-l .ql{font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 0}
.chks{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;padding:5px 0}
.chks label{white-space:nowrap;color:var(--ink-2)}
.chks input{margin:0 5px 0 0;vertical-align:-2px;accent-color:var(--accent)}
.pr-new{display:flex;gap:10px;align-items:center;padding-top:8px}
.pr-new input{flex:1;min-width:0}
.pn-adds{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.dimbox,.colorbox{display:flex;gap:6px;align-items:center}
.dimbox input[type=range]{flex:1;min-width:60px}
.dimbox input[type=number]{width:62px}
.colorbox input[type=text]{flex:1;min-width:0}
.code{font-family:var(--mono);font-size:12px;width:100%;min-height:260px}
.ag-blk{border-top:1px solid var(--rule);padding-top:10px}
.ag-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.ag-h h3{margin:0;font-size:13px;font-weight:600;flex:1}
.ag-pre{margin:0 0 6px;padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.ag-h h4{margin:0;font-size:12px;font-weight:400;color:var(--ink-2);flex:1}
.ag-sub{margin-top:14px}
.ag-blk>.ag-sub:first-child,.ag-blk>.ag-h+.ag-sub,.ag-once+.ag-sub{margin-top:0}
.ag-new{display:flex;gap:10px;align-items:center}
.ag-new input{flex:1}
.ag-once{margin:0 0 10px;padding-left:10px;border-left:2px solid var(--accent);font-size:13px}
.ag-tbl td:last-child{text-align:right;padding-right:0}
.ag-tbl .n{text-align:left;padding-right:10px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--player-h, 0px) + var(--pv-h, 0px) + env(safe-area-inset-bottom, 0px));z-index:80;background:var(--ink);color:var(--paper);padding:8px 14px;font-size:13px;max-width:calc(100vw - 32px)}
body.has-player{--player-h:44px}
/* --player-h 는 플레이어가 보이는 동안 실제 높이로 덮어쓴다(ResizeObserver) — 폭에 따라 한 줄·두 줄 */
body.has-player .app,body.has-preview .app{padding-bottom:calc(var(--player-h, 0px) + var(--pv-h, 0px))}
/* 미리듣기 띠: 공연 플레이어와 다른 것임을 한눈에 — 점선 괘선 + "미리듣기" + 진행 선. 플레이어가 보이면 그 바로 위 */
.pv-bar{position:fixed;left:0;right:0;bottom:var(--player-h, env(safe-area-inset-bottom, 0px));z-index:46;background:var(--paper);border-top:1px dashed var(--ink-3);display:flex;align-items:center;gap:14px;padding:6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));font-size:13px;white-space:nowrap}
.pv-k{font-weight:600}
.pv-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pv-time{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.pv-line{position:absolute;left:0;right:0;top:-1px;height:2px;pointer-events:none}
.pv-line i{display:block;height:100%;width:0;background:var(--ink)}
.tr-table tr.pv-on td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.tr-table button[aria-pressed="true"]{color:var(--ink);font-weight:600}
@media print{.pv-bar{display:none!important}}
.player{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--rule-2);display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));font-size:13px}
.pl-g{display:flex;align-items:center;gap:12px;min-width:0}
.pl-tr{gap:14px}
.pl-tr .tb{font-size:14px;min-width:1.1em;text-align:center}
/* 이전/다음: ⏮⏭(U+23EE/23ED)은 글꼴에 없거나 컬러 이모지로 그려지는 기기가 있어 ❙ + ▶ 로 짠다 (FE0E = 글자 모양) */
.pl-ic{letter-spacing:-.18em;padding-right:.18em}
.pl-info{align-items:baseline;gap:8px;flex:1 1 150px}
.pl-no{font-family:var(--mono);font-weight:500;color:var(--accent);white-space:nowrap}
.pl-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.pl-info .sm{white-space:nowrap}
.pl-pos{flex:2 1 240px;gap:10px}
#pl-seek{flex:1;min-width:60px}
#pl-vol{width:80px}
.pl-time{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--ink-2)}
.pl-volv{font-family:var(--mono);font-size:12px;min-width:3.4em;color:var(--ink-2);white-space:nowrap}
.pl-vs{display:none;font-size:15px;min-width:1.4em;text-align:center}
.pl-mini{font-family:var(--mono);font-size:12px;color:var(--accent)}
/* 곡 목록: 바 위로 펼침. 괘선만 — 지금 곡은 글자색(--accent) */
.pl-q{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:100%;width:min(460px,calc(100vw - 32px));max-height:min(55vh,400px);overflow:auto;background:var(--paper);border:1px solid var(--rule-2);border-bottom:0}
.pl-qh{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;border-bottom:1px solid var(--rule-2);font-size:12px;color:var(--ink-3);white-space:nowrap}
.pl-q ul{list-style:none;margin:0;padding:0}
.pl-q li+li{border-top:1px solid var(--rule)}
.pl-q li button{display:grid;grid-template-columns:4.4em minmax(0,1fr) auto 3em;gap:0 10px;align-items:baseline;width:100%;padding:6px 12px;font-size:13px;color:var(--ink)}
.pl-q li button:hover:not(:disabled){background:var(--tint-2)}
.pl-q li button.on{color:var(--accent)}
.pl-q li button:disabled{color:var(--ink-3);cursor:default}
.pl-q .plq-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-q .plq-d{text-align:right}
.pl-q .note{margin:0;padding:8px 12px}
.toast .toast-a{color:var(--paper);border-bottom:1px solid var(--paper);margin-left:14px;font-weight:600;pointer-events:auto}
/* 알림은 아래 있는 버튼을 가로막지 않는다(방금 누른 [삭제] 위에 떠도 그 자리를 다시 누를 수 있게) — [되돌리기] 만 누른다 */
.toast{pointer-events:none}

/* ---------- 5차: 판 정보 / 이동 모드 / 런 씬 경계 / 코멘트 ---------- */
.rev{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap;min-width:0;flex:none}
.rev .ce{min-width:1em}
.rev .ce[contenteditable="true"]{border-bottom:1px dashed var(--rule-2)}
.rev .ce[contenteditable="true"]:focus{border-bottom-color:var(--accent)}
.menu button:disabled{opacity:.4;cursor:default;background:none}
.menu-note{margin:0;padding:8px 12px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--rule);max-width:240px;white-space:normal}
.movebar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:6px 10px;border-bottom:1px solid var(--accent);background:var(--accent-tint);font-size:13px}
.movebar b{font-weight:600}
/* 6차: 서버 동기화 상태 · 충돌 안내 · 프로젝트 목록 · 시작 화면 */
.sync-st{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.sync-st.red{color:var(--red)}
.syncbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:6px 10px;border-bottom:1px solid var(--red);background:var(--paper);color:var(--red);font-size:13px}
.syncbar b{font-weight:600}
.syncbar .btn{color:var(--ink)}
.syncbar .sync-list{flex:1 1 100%;margin:0;padding:0;list-style:none;color:var(--ink-2);font-size:12px}
.syncbar .sync-list li{padding:2px 0;border-top:1px solid var(--rule)}
.brand{position:relative}
.proj-btn{font:inherit;color:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px dashed var(--rule-2)}
.proj-btn:hover{border-bottom-color:var(--ink-3)}
.proj-btn .caret{font-size:11px;color:var(--ink-3);margin-left:4px}
.proj-menu{position:absolute;left:0;top:calc(100% - 4px);z-index:40;background:var(--paper);border:1px solid var(--rule-2);width:min(420px,calc(100vw - 16px));max-height:min(70vh,560px);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.pj-h{display:flex;align-items:baseline;gap:8px;font-weight:600}
.pj-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.pj-i{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.pj-i .pj-open{flex:1 1 160px;min-width:0;text-align:left;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-i.cur .pj-open{font-weight:600;color:var(--accent)}
.pj-i .note{flex:1 1 100%;order:3}
.pj-a{display:inline-flex;gap:12px}
.pj-new{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pj-new input,.gate-box input,.proj-menu .field input{min-width:0;border:1px solid var(--rule-2);padding:5px 7px;font:inherit;background:var(--paper);color:var(--ink)}
.pj-new input{flex:1 1 160px}
.gate-box input,.proj-menu .field input{width:100%}
.gate{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px}
.gate-box{width:min(440px,100%);margin-top:10vh;border:1px solid var(--rule-2);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.gate-box h2{margin:0;font-size:16px;font-weight:600}
.gate-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.gate-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.gate-list li{border-bottom:1px solid var(--rule)}
.gate-list button{display:block;width:100%;text-align:left;padding:8px 2px;font-size:14px}
.gate-list button:hover{background:var(--tint)}
.gate-list .note{display:block}
.tr-prog{font-family:var(--mono);font-size:12px;color:var(--accent)}
.app.moving .doc p[data-id]:hover{background:var(--accent-tint);cursor:pointer}
.app.moving .cs-table tbody tr.row:hover{--rb:var(--accent-tint)}
.sc-cmt{font-family:var(--mono);font-size:12px}
.new{font-size:11px;color:var(--accent);font-weight:600;margin-left:6px}
.cmt-r{font-size:12px;color:var(--ink-3);margin-left:6px}
.mx-miss{font-family:var(--mono);font-size:12px;color:var(--red);border-bottom:1px dashed var(--red)}
.ck-g li.fix{display:flex;align-items:baseline;gap:12px}
.ck-g li.fix .ref-link{flex:1 1 auto;min-width:0;width:auto}
.ck-fix{flex:none;font-size:12px}
.ltable input.bad,.ltable input.bad:focus{border-bottom:1px solid var(--red)}
.tr-confirm td{font-size:13px;color:var(--ink-2)}
.tr-confirm .btn{margin:0 6px}
.run-timer{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.run-timer.over{color:var(--ink);font-weight:600}
.run-scene{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule-2);padding:12px 0 10px;margin-top:10px}
.rs-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.rs-t{font-size:22px;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.rs-m{font-size:13px;color:var(--ink-3)}
.rs-setup{font-size:14px;color:var(--ink-2);padding-top:6px;overflow-wrap:anywhere}
.rs-setup .chk{white-space:normal;font-size:14px}
.rs-setup.done .rs-sv{text-decoration:line-through;color:var(--ink-3)}
.run-scene.sm{padding:6px 0;border-top-color:var(--rule-2)}
.run-scene.sm .rs-t{font-size:14px}
.run-scene.sm .rs-m,.run-scene.sm .rs-setup{font-size:12px}
.run-lstate{font-size:12px;color:var(--ink-3);padding:6px 0 2px;border-top:1px solid var(--rule);overflow-wrap:anywhere}
.run-gap{font-size:12px;color:var(--ink-3);padding:8px 0 0}
.run-cues tr.ptarget .rc-sum{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.run-pos.t{font-family:var(--sans);font-size:20px;font-weight:600}

/* ---------- 7차: 화자 지정 · 모르는 이름 · 사람별 대본 ---------- */
.doc .spk.unk{color:var(--ink-3)}
.spk-btn{position:absolute;left:calc(-1 * var(--gut));z-index:3;font-size:11px;line-height:1.3;color:var(--ink-3);background:var(--paper);padding:6px 3px 0 0;white-space:nowrap}
.spk-btn:hover{color:var(--accent)}
.spk-pop{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--rule-2);min-width:180px;max-width:calc(100vw - 32px);max-height:min(50vh,320px);overflow:auto;font-size:13px}
.spk-pop .sp-o{display:flex;align-items:baseline;gap:12px;width:100%;padding:6px 12px;border-top:1px solid var(--rule)}

// 공연 모드가 서버 음원을 받아 두는 곳은 따로 'cuesheet-offline' (key = showId/fileKey) — 로컬 모드의 "음원 전체 삭제"와 섞이지 않게
function idbFiles(dbName) { return {
  _p: null,
  open() {
    if (this._p) return this._p;
    const p = new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open(dbName, 1); } catch (e) { rej(e); return; }
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error('IndexedDB 열기 실패'));
      r.onblocked = () => rej(new Error('IndexedDB 가 다른 탭에 의해 잠겨 있습니다'));
    });

    p.catch(() => { this._p = null; });
    return p;
  },
  tx(mode, fn) {
    return this.open().then(db => new Promise((res, rej) => {
      const t = db.transaction('files', mode);
      const r = fn(t.objectStore('files'));
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = () => rej(t.error || (r && r.error) || new Error('IndexedDB 오류'));
      t.onabort = () => rej(t.error || new Error('저장이 중단되었습니다'));

  get(k) { return this.tx('readonly', s => s.get(k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },
  keys() { return this.tx('readonly', s => s.getAllKeys()); },

  keysIn(prefix) { return this.tx('readonly', s => s.getAllKeys(IDBKeyRange.bound(prefix, prefix + '\uffff'))); },
  clear() { return this.tx('readwrite', s => s.clear()); }
}; }

// 공연 모드 = 공연 전에 이 기기에 음원(IndexedDB 'cuesheet-offline')과 큐시트(localStorage)를 받아 두고, 공연 중 네트워크가 끊겨도 재생·진행.

//   get   받을 파일 [{ fileKey, size, nos }] — 같은 파일을 쓰는 트랙은 한 번만. 받아 둔 크기가 서버와 다르면(덜 받음) 다시 받는다
//   skip  이미 받은 파일 · nofile 파일 없는 트랙 · gone 서버 목록에 없는(받을 수 없는) 파일
//   drop  받아 뒀지만 지금 어느 트랙도 쓰지 않는 파일(교체·트랙 삭제) — 준비 끝에 지운다 · bytes = get 의 크기 합(모르는 크기는 0)
function smPlan(tracks, have, server) {

  tracks.forEach(t => {
    if (!t.fileKey) { nofile.push(t); return; }
    const fk = t.fileKey;
    if (seen.has(fk)) { seen.get(fk).nos.push(t.no); return; }
    const size = server && server.has(fk) ? server.get(fk) : null;
    const x = { fileKey: fk, size, nos: [t.no] };

    else if (server && !server.has(fk)) gone.push(x);
    else get.push(x);

// 준비 상태 — 트랙 단위(점검 탭 "음원 파일 n/N" 과 같은 분모 = 트랙 수). prepared = { trackId: 준비할 때의 fileKey } | null

//   level: 'ok'(다 받음) · 'part'(파일 없는 트랙만 남음 — 받을 수 있는 건 다 받음) · 'warn'(받아야 할 것이 남음 — 오프라인이면 재생 안 됨)

  tracks.forEach(t => {

// 시각·길이는 모두 초. 화면 표기는 fmtDur(m:ss — 60분을 넘어도 분으로 센다)
function fmtDur(sec) { if (sec == null || !isFinite(sec)) return '—'; sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

// 그 뒤 씬의 시작 시각은 approx(실제로는 이보다 늦다). 파트·전체 합계 = 길이가 있는 씬의 합 + 길이 빈 씬 수(missing)
//   list   씬 순서대로 [{ id, start, approx, dur }] — 인덱스 = buildIndex 의 seq
//   scenes Map(씬 id → list 의 항목) · parts [{ id, start, approx, sum, missing, count }] · total { sum, missing, count }

    p.scenes.forEach(s => {
      const dur = sceneDur(s), x = { id: s.id, start: t, approx, dur };
      list.push(x); scenes.set(s.id, x);
      if (dur == null) { approx = true; pt.missing++; missing++; } else { t += dur; pt.sum += dur; }

// list[from] ~ list[to-1] 을 지나가는 데 드는 시간 (to 는 넣지 않음). known = 길이가 있는 씬이 하나라도 있음

  return { sum, missing, known };
}

// 그 밖(두 글자·네 글자 복성 등)은 그대로. 줄인 이름이 다른 사람과 겹치면(김민수·이민수, 민수·김민수) 그 사람들은 원래 이름으로,
// 원래 이름까지 같으면 뒤에 (1)(2) 순번. 반환 Map(사람 id → 짧은 이름)
function shortNames(people) {
  const full = new Map(), short = new Map();
  (people || []).forEach(p => {
    const n = String(p.name || '').trim();

    let s = n;

// 출연자 요약: "대훈·예준", 셋 이상이면 "대훈·예준 +1". first = 맨 앞에 둘 사람(출연자 역할로 볼 때 나), 모르는 id 는 "?"

/* ================= 저장 계층: Store ================= */
// Store = LocalStore | ServerStore. 시작할 때 GET /api/health 가 되면 서버 모드, 아니면 로컬 모드(아티팩트·file://·서버 없음)
//   saveShow()  지금 state.show 를 저장 (save() 가 부른다)
//   fileUrl(t)  트랙 음원 주소 (없으면 null)
//   loadFiles() 음원 목록/Blob 을 불러온 뒤 render
//   upload(t, file) · delFile(key) · clearFiles() → Promise
const LocalStore = {
  mode: 'local',
  saveShow() {
    const ok = lsSet(KEY_SHOW, JSON.stringify(state.show));
    if (!ok && !state.saveWarned) { state.saveWarned = true; toast('브라우저 저장소를 쓸 수 없어 이 탭에서만 유지됩니다.'); }
  },
  fileUrl(t) { return fileUrls.get(t.fileKey) || null; },
  loadFiles() {
    return IDB.keys().then(keys => {
      const have = new Set(keys);
      const need = state.show.tracks.filter(t => t.fileKey && have.has(t.fileKey) && !fileUrls.has(t.fileKey));
      return Promise.all(need.map(t => IDB.get(t.fileKey).then(b => { if (b) fileUrls.set(t.fileKey, URL.createObjectURL(b)); })));
    }).then(() => { idbError = ''; }, err => { idbError = idbMsg(err); }).then(() => render());
  },
  upload(t, file) {
    trackErr.delete(t.id); trackBusy.add(t.id); render();
    const key = uid('f');
    IDB.put(key, file).then(() => {
      const old = t.fileKey;
      if (old && old !== key) LocalStore.delFile(old);
      t.fileKey = key; t.fileName = file.name || ('BGM ' + t.no);
      fileUrls.set(key, URL.createObjectURL(file));
      return probeDuration(fileUrls.get(key));
    }).then(d => {
      if (d != null) t.durationSec = Math.round(d * 10) / 10;
      trackBusy.delete(t.id); commit(); toast(`BGM ${t.no} 저장됨 — ${t.fileName}`);
    }).catch(err => {
      trackBusy.delete(t.id); trackErr.set(t.id, '저장 실패: ' + idbMsg(err)); render();
    });
  },
  delFile(key) {
    const u = fileUrls.get(key); if (u) { URL.revokeObjectURL(u); fileUrls.delete(key); }
    return IDB.del(key).catch(() => {});
  },
  clearFiles() { return IDB.clear().then(() => { fileUrls.forEach(u => URL.revokeObjectURL(u)); fileUrls.clear(); }); }
};

// 서버 모드 상태. rev = 마지막으로 서버와 맞춘 판 번호, dirty = 아직 PUT 하지 않은 변경
// editKeys = 프로젝트별 편집 비밀번호(이 브라우저에 기억), editDefault = 지금 프로젝트가 아직 1234 인지, locked = 편집 키가 없어 저장이 멈춤
// outdated = 서버가 이 화면보다 새 형식(SHOW_VER)을 안다 — 저장을 멈추고 새로고침을 요구한다(프로젝트를 바꿔도 유지). schemaAt = 마지막 /api/health 확인 시각
const Srv = {
  key: '', showId: null, rev: 0, etag: null, list: [], audioKeys: null, hasPassword: false,
  dirty: false, inflight: false, conflict: null, err: false, gone: false, retryT: null, pollT: null, polling: false, deferred: false,
  runPos: {}, localRun: null, editKeys: loadEditKeys(), editDefault: false, locked: false, outdated: false, schemaAt: 0
};
// 편집 비밀번호는 설정(KEY_PREF)과 따로 둔다 — { showId: 비밀번호 }
function loadEditKeys() {
  try { const o = JSON.parse(lsGet('cueSheet.editKeys') || '{}'); return o && typeof o === 'object' && !Array.isArray(o) ? o : {}; } catch (e) { return {}; }
}
function saveEditKeys() { lsSet('cueSheet.editKeys', JSON.stringify(Srv.editKeys)); }
function editKey(id) { const k = Srv.editKeys[id || Srv.showId]; return typeof k === 'string' ? k : ''; }
function setEditKey(id, k) { if (k) Srv.editKeys[id] = k; else delete Srv.editKeys[id]; saveEditKeys(); }
// 로컬 모드는 항상 편집 가능. 서버 모드는 그 프로젝트의 편집 비밀번호를 알 때만
const DEFAULT_EDIT_KEY = '1234';
function canEdit() { return Store.mode !== 'server' || !!editKey(); }
function editHeaders(id) { const k = editKey(id); return k ? { 'X-Edit-Key': enc(k) } : {}; }
// 409 자동 병합: base = 마지막으로 서버와 맞춘 show, mergeTries = 연속 병합 횟수, mergeWait = 입력 중이라 미룬 409 응답
Object.assign(Srv, { base: null, mergeTries: 0, mergeWait: null });
const POLL_MS = 5000, RETRY_MS = 5000;
const trackProg = new Map();
const enc = encodeURIComponent;
function showPath(id) { return '/shows/' + enc(id || Srv.showId); }
// <audio src> 와 다운로드 링크는 헤더를 못 실으니 ?key=
function audioUrl(key, download) {
  const q = [];
  if (download) q.push('download=1');
  if (Srv.key) q.push('key=' + enc(Srv.key));
  return '/api' + showPath() + '/audio/' + enc(key) + (q.length ? '?' + q.join('&') : '');
}
function keyHeaders() { return Srv.key ? { 'X-App-Key': enc(Srv.key) } : {}; }
// 모든 /api 호출. 401 이면 비밀번호를 다시 묻고 같은 요청을 다시 보낸다. 네트워크 오류는 reject
// /shows/<id>… 요청에는 기억해 둔 그 프로젝트의 편집 비밀번호를 싣는다. 403 edit_forbidden 이면 그 비밀번호를 잊는다(바뀌었거나 틀림)
async function api(method, p, body, headers) {
  const m = /^\/shows\/([^/?]+)/.exec(p), sid = m ? decodeURIComponent(m[1]) : null;
  for (;;) {
    const h = Object.assign(keyHeaders(), sid ? editHeaders(sid) : {}, headers || {});
    let b;
    if (body !== undefined) { h['Content-Type'] = 'application/json'; b = JSON.stringify(body); }
    let r;
    if (smNoNet()) { smNet(false); throw new TypeError('오프라인'); } // 공연 모드 + 기기가 오프라인: 보내 봐야 실패 — 연결되면 online 이벤트가 다시 부른다
    try { r = await fetch('/api' + p, { method, headers: h, body: b, cache: 'no-store' }); } catch (e) { smNet(false); throw e; }
    smNet(true);
    if (r.status === 401) { await askPassword(true); continue; }
    let data = null;
    if (r.status !== 304) { try { data = await r.json(); } catch (e) { data = null; } }
    if (r.status === 403 && data && data.error === 'edit_forbidden' && sid && editKey(sid) && h['X-Edit-Key'] === enc(editKey(sid))) setEditKey(sid, '');
    return { status: r.status, data, etag: r.headers.get('ETag') };
  }
}
function pendingLocal() { return !!(saveT || Srv.dirty || Srv.inflight || Srv.conflict || Srv.locked || Srv.outdated); }
function backupLocal() {
  if (!Srv.showId || !state.show) return;
  lsSet('cueSheet.backup.' + Srv.showId, JSON.stringify({ baseRev: Srv.rev, savedAt: new Date().toISOString(), show: state.show }));
}
// PUT 은 한 번에 하나. 끝났을 때 또 바뀌어 있으면 이어서 한 번 더
async function push() {
  // 편집 잠김·새 버전 대기 동안 이어진 수정도 이 브라우저 백업에 계속 반영한다(잠금을 못 풀어도 최신 변경이 남게)
  if ((Srv.locked || Srv.outdated || Srv.mergeWait) && Srv.dirty && Store.mode === 'server') backupLocal();
  if (Store.mode !== 'server' || !Srv.showId || Srv.inflight || Srv.conflict || !Srv.dirty || Srv.gone || Srv.locked || Srv.outdated || Srv.mergeWait) { renderSync(); return; }
  clearTimeout(Srv.retryT); Srv.retryT = null;
  const id = Srv.showId;
  if (!editKey(id)) { lockSave(); return; }
  Srv.inflight = true; Srv.dirty = false; renderSync();
  let r = null;
  const sent = clone(state.show); // 성공하면 이것이 병합 기준(서버와 맞춘 내용) — 기다리는 사이 state.show 는 계속 바뀐다
  try { r = await api('PUT', showPath(id), { baseRev: Srv.rev, show: sent }); } catch (e) { r = null; }
  Srv.inflight = false;
  if (id !== Srv.showId) return;
  if (r && r.status === 200) {
    Srv.rev = r.data.rev; Srv.etag = r.etag || `"${r.data.rev}"`; Srv.err = false;
    Srv.base = sent; Srv.mergeTries = 0;
    state.show.updatedAt = r.data.updatedAt;
    smSaveShow(); // 공연 모드: 서버와 맞춘 판을 이 기기 사본으로
    const it = Srv.list.find(x => x.id === id); if (it) { it.rev = r.data.rev; it.updatedAt = r.data.updatedAt; it.title = state.show.title; }
  } else if (r && r.status === 409) {
    Srv.dirty = true; Srv.err = false; onConflict(r.data); // 자동 병합(→ 아래에서 다시 저장) 또는 선택 바
  } else if (r && r.status === 404) {
    Srv.dirty = true; Srv.gone = true; backupLocal(); showGone(); return;
  } else if (r && r.status === 403) {
    Srv.dirty = true; lockSave(); return;
  } else if (r && r.status === 426) {
    Srv.dirty = true; markOutdated(); return; // 서버 데이터가 이 화면보다 새 형식 — 재시도하지 않는다
  } else {
    Srv.dirty = true; Srv.err = true; backupLocal();
    Srv.retryT = setTimeout(push, RETRY_MS);
  }
  renderRev(); renderSync(); renderSyncBar();
  if (Srv.dirty && !Srv.err && !Srv.conflict) push();
}
// 저장 대기분을 서버에 다 보낼 때까지 기다린다 (전환·복제 전). 충돌·오류로 못 보내면 false
function flushServer() {
  flushSave();
  return new Promise(res => {
    const t0 = Date.now();
    (function wait() {
      if (Store.mode !== 'server' || !Srv.showId) return res(true);
      if (!Srv.inflight && !Srv.dirty) return res(true);
      if (Srv.conflict || Srv.err || Srv.gone || Srv.locked || Srv.outdated || Date.now() - t0 > 15000) return res(false);
      setTimeout(wait, 60);
    })();
  });
}
const ServerStore = {
  mode: 'server',
  saveShow() { Srv.dirty = true; push(); },
  // 공연 모드이고 이 기기에 받아 둔 파일이면 objectURL(네트워크 없이 재생), 아니면 스트리밍
  fileUrl(t) { return smUrl(t) || (Srv.audioKeys && !Srv.audioKeys.has(t.fileKey) ? null : audioUrl(t.fileKey)); },
  loadFiles() {
    const id = Srv.showId;
    return api('GET', showPath(id) + '/audio').then(r => {
      if (id !== Srv.showId) return;
      if (r.status !== 200 || !Array.isArray(r.data)) throw new Error('HTTP ' + r.status);
      Srv.audioKeys = new Set(r.data.map(x => x.fileKey)); idbError = '';
      Srv.audioSizes = new Map(r.data.map(x => [x.fileKey, Number(x.size)])); // 공연 모드 준비: 받을 크기·덜 받은 파일 확인
    }).catch(err => { if (id === Srv.showId) idbError = '서버 음원 목록을 불러오지 못했습니다 (' + (err && err.message || err) + ')'; }).then(() => { if (state.show) render(); });
  },
  // XMLHttpRequest: fetch 로는 업로드 진행률을 못 받는다
  upload(t, file) {
    const tid = t.id, showId = Srv.showId, key = uid('f');
    trackErr.delete(tid); trackBusy.add(tid); trackProg.set(tid, 0); render();
    const done = (err) => {
      trackBusy.delete(tid); trackProg.delete(tid);
      if (showId !== Srv.showId) return;
      if (err) { trackErr.set(tid, '업로드 실패: ' + err); render(); }
    };
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', '/api' + showPath(showId) + '/audio/' + enc(key));
    Object.entries(Object.assign(keyHeaders(), editHeaders(showId))).forEach(([k, v]) => xhr.setRequestHeader(k, v));
    xhr.setRequestHeader('Content-Type', /^audio\/[\w.+-]+$/.test(file.type || '') ? file.type : 'application/octet-stream');
    xhr.setRequestHeader('X-File-Name', enc(file.name || ''));
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const p = Math.min(100, Math.round(e.loaded / e.total * 100));
      trackProg.set(tid, p);
      const el = document.getElementById('trprog-' + tid); if (el) el.textContent = `업로드 중 ${p}%`;
    };
    xhr.onerror = () => done('네트워크 오류');
    xhr.onload = () => {
      if (xhr.status === 401) { done('비밀번호가 필요합니다 — 다시 시도하세요'); askPassword(true); return; }
      if (xhr.status === 403) { setEditKey(showId, ''); done('편집 비밀번호가 필요합니다 — 잠금 해제 후 다시 올리세요'); if (showId === Srv.showId) openUnlock(); return; }
      if (xhr.status !== 200) { done('HTTP ' + xhr.status + (xhr.status === 413 ? ' (100MB 초과)' : '')); return; }
      if (showId !== Srv.showId) { done(); return; }
      if (!Srv.audioKeys) Srv.audioKeys = new Set();
      Srv.audioKeys.add(key);
      probeDuration(audioUrl(key)).then(d => {
        done();
        // 업로드 중에 다른 기기의 변경을 불러왔을 수 있다 — 트랙을 id 로 다시 찾는다
        const tr = state.show.tracks.find(x => x.id === tid);
        if (!tr) { toast('업로드한 트랙이 그사이 삭제되었습니다'); ServerStore.delFile(key); render(); return; }
        const old = tr.fileKey;
        if (old && old !== key && !state.show.tracks.some(x => x !== tr && x.fileKey === old)) ServerStore.delFile(old);
        tr.fileKey = key; tr.fileName = file.name || ('BGM ' + tr.no);
        if (d != null) tr.durationSec = Math.round(d * 10) / 10;
        commit(); toast(`BGM ${tr.no} 업로드됨 — ${tr.fileName}`);
      });
    };
    xhr.send(file);
  },
  delFile(key) {
    if (Srv.audioKeys) Srv.audioKeys.delete(key);
    return api('DELETE', showPath() + '/audio/' + enc(key)).catch(() => {});
  },
  clearFiles() {
    return api('DELETE', showPath() + '/audio').then(r => { if (r.status !== 200) throw new Error('HTTP ' + r.status); Srv.audioKeys = new Set(); });
  }
};
let Store = LocalStore;

/* ---- 상단 상태 표시 · 충돌 안내 바 ---- */
function renderSync() {
  const el = $('#sync-st'); if (!el) return;
  let t = '', red = false;
  if (Store.mode === 'local') t = '로컬 모드 — 이 브라우저에만 저장';
  else if (!Srv.showId || !state.show) t = '';
  else if (Srv.outdated) { t = '저장 안 됨 — 새 버전 있음'; red = true; }
  else if (Srv.gone) { t = '저장 안 됨 — 프로젝트 없음'; red = true; }
  else if (Srv.locked) { t = '저장 안 됨 — 편집 잠김'; red = true; }
  else if (Srv.conflict) { t = '저장 안 됨 — 충돌'; red = true; }
  else if (smOffline()) t = '오프라인 · 저장은 연결되면 보냄'; // 공연 모드: 끊겨도 빨간 경고 대신 한 줄 — 백업·재시도는 그대로
  else if (Srv.err) { t = '저장 안 됨 — 재시도 중'; red = true; }
  else if (Srv.mergeWait) t = '저장 대기 — 입력을 마치면 다른 기기 변경과 합칩니다';
  else if (saveT || Srv.dirty || Srv.inflight) t = '저장 중…';
  else t = '저장됨 · rev ' + Srv.rev;
  if (el.textContent !== t) el.textContent = t;
  el.classList.toggle('red', red);
  el.title = Store.mode === 'local' ? '서버에 연결되지 않아 이 브라우저(localStorage·IndexedDB)에만 저장합니다' : smOffline() ? '네트워크가 끊겼습니다 — 공연 모드로 받아 둔 음원·큐시트로 진행합니다. 변경은 이 브라우저에 백업하고 연결되면 서버에 보냅니다' : Srv.err ? `${RETRY_MS / 1000}초마다 다시 저장합니다 — 그동안 이 브라우저에도 백업` : '';
}
function renderSyncBar() {
  const b = $('#syncbar'); if (!b) return;
  const c = Srv.conflict;
  renderPwBar();
  if (Srv.outdated && Store.mode === 'server') {
    b.hidden = false;
    b.innerHTML = `<span><b>새 버전이 있습니다</b> — 이 화면은 옛 버전이라 저장을 멈췄습니다. 이 기기의 변경은 이 브라우저에 백업했습니다</span>
      <button type="button" class="btn" id="outdated-reload" data-act="gate-retry">새로고침</button>`;
    return;
  }
  if (!c && Srv.locked && Store.mode === 'server' && Srv.showId) {
    b.hidden = false;
    b.innerHTML = `<span><b>편집 잠김</b> — 이 기기의 변경이 서버에 저장되지 않았습니다. 이 프로젝트의 편집 비밀번호가 필요합니다 (다른 기기에서 바뀌었을 수 있음)</span>
      <button type="button" class="btn" id="lock-unlock" data-act="unlock-open">잠금 해제하고 저장</button><button type="button" class="btn" id="lock-discard" data-act="lock-discard" data-confirm="정말 버리기? (이 기기의 저장 안 된 변경이 사라짐)">내 변경 버리고 서버 버전 보기</button>`;
    return;
  }
  b.hidden = !c;
  if (!c) { b.innerHTML = ''; return; }
  // c.merge = 자동 병합 결과(충돌 목록). 없으면(병합 모듈 없음·형식이 다름 등) 통째 선택만
  const cs = c.merge ? c.merge.conflicts : [], n = cs.length, MAX = 5;
  b.innerHTML = `<span><b>다른 기기에서 수정됨</b> — 서버 rev ${esc(c.rev)}${c.updatedAt ? ' (' + esc(fmtTime(c.updatedAt)) + ')' : ''}. ${n ? `자동으로 합치지 못한 곳 ${n}곳 — ` : ''}이 기기의 변경은 아직 저장되지 않았습니다</span>
    ${n ? `<ul class="sync-list">${cs.slice(0, MAX).map(x => `<li>${esc(x.text)}</li>`).join('')}${n > MAX ? `<li>외 ${n - MAX}곳</li>` : ''}</ul>` : ''}
    <button type="button" class="btn" id="sync-load" data-act="sync-load">서버 버전 사용</button><button type="button" class="btn" id="sync-overwrite" data-act="sync-overwrite" data-confirm="정말 덮어쓰기? (서버 rev ${esc(c.rev)} 의 변경이 사라짐)">내 것으로 덮어쓰기</button>${n ? `<button type="button" class="btn" id="sync-merge" data-act="sync-merge" data-confirm="정말? (충돌 ${n}곳은 이 기기 변경 대신 서버 것)">충돌 항목만 서버 것으로, 나머지는 병합</button>` : ''}`;
}

// 기본 비밀번호(1234) 안내: 편집 중인 동안 계속 보인다
function renderPwBar() {
  const b = $('#pwbar'); if (!b) return;
  const on = Store.mode === 'server' && !!Srv.showId && !!state.show && state.edit && canEdit() && Srv.editDefault;
  b.hidden = !on;
  const html = on ? `<span><b>기본 비밀번호(1234) 사용 중</b> — 사이트에 들어오는 누구나 이 프로젝트를 고칠 수 있습니다. 바꾸세요</span><button type="button" class="btn" id="pw-change" data-act="editpw-open">편집 비밀번호 변경</button>` : '';
  if (b.innerHTML !== html) b.innerHTML = html;
}
// 편집 키가 없어(또는 틀려) 저장을 못 했다 — 변경은 그대로 두고(dirty) 이 브라우저에 백업한 뒤 비밀번호를 묻는다
function lockSave() {
  Srv.locked = true; Srv.dirty = true;
  backupLocal(); renderSync(); renderSyncBar();

      if (open) h += `<tr class="tr-uses"><td colspan="${ed ? 5 : 4}">${uses.map(u => `<button type="button" class="ref-link" data-act="comment-goto" data-item="${esc(u.e.item.id)}">${u.e.q ? 'Q' + esc(u.e.q) + ' · ' : ''}${esc(sceneTitle(u.e.scene))} — ${esc(cueText(u.c))}</button>`).join('')}</td></tr>`;
    });

  }

  h += `<div class="sec-h" id="pre-props"><h2>공연 전 무대</h2><span class="note">공연 시작 때 이미 무대에 있는 소품 — IN 으로 셉니다</span>${ed ? `<button type="button" class="btn" id="btn-pre-prop-add" data-act="pre-prop-add" ${S.props.length ? '' : 'disabled'}>+ 공연 전 소품</button>` : ''}</div>`;
  if (S.preShowSetup) h += `<p class="note pre-txt">세팅 지시 (자유 텍스트) · ${esc(S.preShowSetup)}</p>`;

  else {
    h += `<div class="table-wrap"><table class="ltable pr-table"><thead><tr><th>소품</th><th>위치</th>${ed ? '<th></th>' : ''}</tr></thead><tbody>`;
    S.preShowProps.forEach((x, i) => {
      const known = IDX.props.has(x.propId);
      h += `<tr id="pre-prop-${i}"><td>${ed ? `<select id="pp-prop-${i}" data-act="pre-prop" data-i="${i}" data-k="propId" aria-label="소품">${known ? '' : `<option value="${esc(x.propId)}" selected>(삭제된 소품)</option>`}${S.props.map(p => `<option value="${esc(p.id)}" ${p.id === x.propId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : `<span class="${known ? '' : 'red'}">${esc(propName(x.propId))}</span>`}</td>
        <td>${ed ? `<input type="text" id="pp-at-${i}" value="${esc(x.at)}" data-act="pre-prop" data-i="${i}" data-k="at" placeholder="예: 무대 중앙" aria-label="위치">` : esc(x.at)}</td>
        ${ed ? `<td style="white-space:nowrap"><button type="button" class="tb red" id="pp-del-${i}" data-act="pre-prop-del" data-i="${i}">삭제</button></td>` : ''}</tr>`;
    });
    h += '</tbody></table></div>';
  }
  return h;
}

/* ================= 점검: 규칙 (순수 함수 — test/check.test.js) ================= */
// 심각도: block 막힘(이대로면 공연이 막힘 — 빨강) · check 확인(공연 전에 확인) · info 참고(건수에 세지 않음)
const CK_SEV = ['block', 'check', 'info'];
const CK_SEV_L = { block: '막힘', check: '확인', info: '참고' };
// 그룹 순서 = 화면 순서(막힘 → 확인 → 참고). short 는 맨 아래 "문제 없음: …" 줄, depts 는 이 그룹에 나올 수 있는 부서('any' = 큐 부서 그대로)

  { k: 'cast', sev: 'block', t: '인/아웃 반복', short: '인/아웃 반복', note: '같은 사람의 IN 다음 또 IN, OUT 다음 또 OUT.', depts: ['cast'] },

  { k: 'noprops', sev: 'check', t: '소품 미지정 무대 큐', short: '소품 미지정', note: '확정 무대 큐인데 소품이 없습니다 — 소품을 등록하고 대상으로 고르세요(v8: 무대 큐는 소품 필수). 원래 문장은 상세에 있습니다.', depts: ['stage'] },
  { k: 'files', sev: 'check', t: '음원 파일', short: '음원 파일', note: '', depts: ['sound'] },
  { k: 'emptyq', sev: 'check', t: '빈 문단에 붙은 큐', short: '빈 문단 큐', note: '본문이 빈 대사·지문에 큐가 붙어 있습니다 — 큐 지점으로 바꾸세요(본문 없이 큐만 보이는 실행 지점). lib/validate.js empty-cued 와 같은 조건.', depts: ['common'] },

  { k: 'cmt', sev: 'info', t: '미해결 코멘트', short: '코멘트', note: '', depts: ['common'] }
